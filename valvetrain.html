<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crankshaft &amp; Pistons · Auto Lab</title>
<link rel="stylesheet" href="app.css">
<style>
:root { --al-accent: #ca8a04; }
html.light-theme { --al-accent: #a16207; }

#panel-readout .al-read{
  display:grid;grid-template-columns:1fr auto;gap:3px 12px;
  font:500 11px/1.45 var(--font-mono);
}
.al-read .k{color:var(--text-dim);}
.al-read .v{color:var(--text);text-align:right;font-weight:700;}
.al-read .v.hi{color:var(--al-accent);}
.al-read .v.ok{color:var(--ok);}
.al-read .v.warn{color:var(--warn);}
.al-read .v.crit{color:var(--crit);}

.al-tabs{margin-top:10px;}
.al-sec{margin-top:12px;}
.al-sec:first-child{margin-top:2px;}
.al-sec h4{
  margin:0 0 6px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700;
}
.al-sec p{margin:0 0 8px;font-size:12px;line-height:1.5;color:var(--text-dim);}
.al-sec ul{margin:0 0 8px;padding-left:16px;font-size:12px;line-height:1.55;color:var(--text-dim);}
.al-sec li{margin-bottom:3px;}
.al-sec b{color:var(--text);}

.al-fault{
  border:1px solid var(--border);border-radius:var(--r-xs,6px);
  padding:8px 10px;margin-bottom:6px;background:var(--surface-2);
}
.al-fault .t{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.al-fault .s{font-size:11px;line-height:1.45;color:var(--text-dim);}
.al-fault .c{font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}

.al-q{margin-bottom:12px;}
.al-q .q{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4;}
.al-opt{
  display:block;width:100%;text-align:left;min-height:40px;padding:8px 10px;margin-bottom:4px;
  border:1px solid var(--border);border-radius:var(--r-xs,6px);background:var(--surface-2);
  color:var(--text-dim);font:inherit;font-size:12px;cursor:pointer;
}
.al-opt:hover{border-color:var(--border-hi);}
.al-opt:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}
.al-opt.ok{border-color:var(--ok);color:var(--ok);}
.al-opt.no{border-color:var(--crit);color:var(--crit);}
.al-exp{display:none;font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}

.al-w{display:flex;flex-direction:column;gap:6px;min-width:160px;}
.al-w label{
  display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-mute);
}
.al-w b{color:var(--text);font-family:var(--font-mono);}
.al-range{width:100%;height:28px;background:transparent;accent-color:var(--al-accent);cursor:pointer;}
.al-range:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}

.al-legend{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text-dim);}
.al-legend span{display:flex;align-items:center;gap:7px;}
.al-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

.al-timing-canvas{
  width:100%; height:auto; display:block;
  border-radius:var(--r-xs,6px);
  background:color-mix(in oklch, var(--bg) 60%, transparent);
  border:1px solid var(--border);
}

.ui-tb-btn.active{outline:2px solid var(--al-accent);color:var(--al-accent);}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId:  'crankpiston',
  accent:    '#ca8a04',
  cycleHz:   0.85,       // crank revolutions per second at speedMul = 1
  crankR:    0.50,       // crank throw radius (half of visual stroke)
  bore:      0.55,       // cylinder bore (visual)
  headY:     3.40,       // fixed cylinder head Y
  pistonHalf:0.25,       // piston body half-height
  spacing:   1.10,       // distance between cylinder centres along crank
  rodRatio:  3.4,        // default L/r
  /* Four-stroke cycle: 720° total */
  CYCLE:     720
};

/* Firing order 1-3-4-2 for the classic inline-4.
   FireOffsets are the crank degrees at which each cylinder begins its power stroke.
   Note: cylinders 1 & 4 share a crank throw (in phase), 2 & 3 share the opposite throw. */
const CYLINDERS = [
  { id: 1, x: -1.65, pistonPhase: 0,   fireOffset:   0, colour: 0xd946ef },
  { id: 2, x: -0.55, pistonPhase: 0.5, fireOffset: 540, colour: 0x38bdf8 },
  { id: 3, x:  0.55, pistonPhase: 0.5, fireOffset: 180, colour: 0x38bdf8 },
  { id: 4, x:  1.65, pistonPhase: 0,   fireOffset: 360, colour: 0xd946ef }
];

/* Stroke palette (matches both themes reasonably well) */
const STROKE = {
  intake:      { name: 'Intake',      colour: 0x38bdf8, css: '#38bdf8' },
  compression: { name: 'Compression', colour: 0xfbbf24, css: '#fbbf24' },
  power:       { name: 'Power',       colour: 0xef4444, css: '#ef4444' },
  exhaust:     { name: 'Exhaust',     colour: 0x94a3b8, css: '#94a3b8' }
};

const state = Base.createUIState();
state.rodRatio = 3.4;       // 3.0 … 5.0 via slider

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [7.0, 3.6, 8.5],
  target: [0, 1.80, 0],
  floorY: -0.30,
  fogDensity: 0.024
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;
controls.minDistance = 5;
controls.maxDistance = 24;

const root = new THREE.Group();
scene.add(root);

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();

const crankMat  = new THREE.MeshStandardMaterial({ color: 0xb8c0cc, metalness: 0.88, roughness: 0.26 });
const throwMat  = new THREE.MeshStandardMaterial({ color: 0x8a93a5, metalness: 0.82, roughness: 0.30 });
const cwMat     = new THREE.MeshStandardMaterial({ color: 0x4a5160, metalness: 0.68, roughness: 0.42 });
const rodMat    = new THREE.MeshStandardMaterial({ color: 0xc5ccd6, metalness: 0.80, roughness: 0.28 });
const pistonMat = new THREE.MeshStandardMaterial({ color: 0xd4dbe6, metalness: 0.74, roughness: 0.30 });
const ringMat   = new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.92, roughness: 0.22 });
const headMat   = new THREE.MeshStandardMaterial({ color: 0x50596a, metalness: 0.58, roughness: 0.52 });
const wallMat   = new THREE.MeshStandardMaterial({
  color: 0x6b7484, metalness: 0.40, roughness: 0.55,
  transparent: true, opacity: 0.18,
  side: THREE.DoubleSide, depthWrite: false
});

/* Gas volume inside the cylinder — emissive so it reads as "hot" */
function makeGasMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.45,
    metalness: 0.0, roughness: 1.0,
    transparent: true, opacity: 0.55,
    depthWrite: false, side: THREE.DoubleSide
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   CRANKSHAFT — fixed throws paired in phase
   ═══════════════════════════════════════════════════════════════════════ */
const crank = new THREE.Group();
root.add(crank);

/* Main journals (5 of them, evenly spaced between the cylinders) */
const mainXs = [-2.20, -1.10, 0.00, 1.10, 2.20];
const mainJGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.32, lowEnd ? 12 : 18);
mainXs.forEach(x => {
  const j = new THREE.Mesh(mainJGeo, crankMat);
  j.rotation.z = Math.PI / 2;
  j.position.set(x, 0, 0);
  j.castShadow = true;
  crank.add(j);
});

/* Crank throws — 4, but paired in phase.
   Cylinders 1 & 4 → throw at +Y offset  (pistonPhase 0)
   Cylinders 2 & 3 → throw at -Y offset  (pistonPhase 0.5) */
const throwJGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.28, lowEnd ? 12 : 18);
const cwGeo     = new THREE.CylinderGeometry(0.36, 0.36, 0.13, lowEnd ? 12 : 20);
const webGeo    = new THREE.BoxGeometry(0.09, 0.30, 0.28);

CYLINDERS.forEach(c => {
  const ySign = c.pistonPhase === 0 ? +1 : -1;

  /* Rod journal (the bit the connecting rod bolts to) */
  const th = new THREE.Mesh(throwJGeo, throwMat);
  th.rotation.z = Math.PI / 2;
  th.position.set(c.x, ySign * CFG.crankR, 0);
  th.castShadow = true;
  crank.add(th);

  /* Counterweight opposite the throw */
  const cw = new THREE.Mesh(cwGeo, cwMat);
  cw.rotation.z = Math.PI / 2;
  cw.position.set(c.x, -ySign * CFG.crankR * 0.62, 0);
  cw.castShadow = true;
  crank.add(cw);

  /* Two web plates connecting the rod journal to the crank axis */
  [-0.10, 0.10].forEach(dx => {
    const w = new THREE.Mesh(webGeo, throwMat);
    w.position.set(c.x + dx, 0, 0);
    crank.add(w);
  });

  /* Store the throw's initial phase for animation reference */
  c.throwSign = ySign;
});

/* ═══════════════════════════════════════════════════════════════════════
   PISTONS + CONNECTING RODS
   ═══════════════════════════════════════════════════════════════════════ */
const pistonBodyGeo = new THREE.CylinderGeometry(CFG.bore, CFG.bore, CFG.pistonHalf * 2, lowEnd ? 16 : 24);
const pistonTopGeo  = new THREE.CylinderGeometry(CFG.bore * 0.98, CFG.bore * 0.98, 0.05, lowEnd ? 16 : 24);
const ringGeo       = new THREE.CylinderGeometry(CFG.bore * 1.005, CFG.bore * 1.005, 0.030, lowEnd ? 16 : 24);
const rodShaftGeo   = new THREE.CylinderGeometry(0.085, 0.105, 1, lowEnd ? 10 : 14);
const smallEndGeo   = new THREE.CylinderGeometry(0.105, 0.105, 0.10, lowEnd ? 10 : 14);
const bigEndGeo     = new THREE.CylinderGeometry(0.150, 0.150, 0.12, lowEnd ? 10 : 14);

/* Unit cylinder for the gas volume — base at origin, top at y = 1 */
const gasGeo = new THREE.CylinderGeometry(CFG.bore * 0.95, CFG.bore * 0.95, 1, lowEnd ? 16 : 24);
gasGeo.translate(0, 0.5, 0);

CYLINDERS.forEach(c => {
  /* --- Transparent cylinder wall --- */
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(CFG.bore + 0.04, CFG.bore + 0.04, CFG.headY - 0.60, lowEnd ? 16 : 26, 1, true),
    wallMat
  );
  wall.position.set(c.x, (CFG.headY + 0.60) / 2, 0);
  root.add(wall);

  /* --- Cylinder head (solid cap at top) --- */
  const head = new THREE.Mesh(
    new THREE.CylinderGeometry(CFG.bore + 0.08, CFG.bore + 0.08, 0.10, lowEnd ? 16 : 24),
    headMat
  );
  head.position.set(c.x, CFG.headY + 0.05, 0);
  head.castShadow = true;
  root.add(head);

  /* --- Piston group (moves up/down) --- */
  const pistonG = new THREE.Group();
  root.add(pistonG);

  const body = new THREE.Mesh(pistonBodyGeo, pistonMat);
  body.castShadow = true;
  pistonG.add(body);

  const top = new THREE.Mesh(pistonTopGeo, ringMat);
  top.position.y = CFG.pistonHalf - 0.025;
  pistonG.add(top);

  /* Three piston rings — two compression, one oil-control */
  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(ringGeo, ringMat);
    r.position.y = CFG.pistonHalf - 0.10 - i * 0.055;
    pistonG.add(r);
  }

  /* --- Gas volume above the piston (colour changes with stroke) --- */
  const gasMat = makeGasMaterial();
  const gas = new THREE.Mesh(gasGeo, gasMat);
  root.add(gas);

  /* --- Connecting rod: separate meshes so we can orient and scale each frame --- */
  const rod = new THREE.Mesh(rodShaftGeo, rodMat);
  rod.castShadow = true;
  root.add(rod);

  const smallEnd = new THREE.Mesh(smallEndGeo, rodMat);
  smallEnd.rotation.z = Math.PI / 2;
  root.add(smallEnd);

  const bigEnd = new THREE.Mesh(bigEndGeo, rodMat);
  bigEnd.rotation.z = Math.PI / 2;
  root.add(bigEnd);

  c.pistonG = pistonG;
  c.rod = rod;
  c.smallEnd = smallEnd;
  c.bigEnd = bigEnd;
  c.gas = gas;
  c.gasMat = gasMat;

  /* Highlight rings that light up when this cylinder is on its power stroke */
  c.glowRing = new THREE.Mesh(
    new THREE.CylinderGeometry(CFG.bore + 0.10, CFG.bore + 0.10, 0.02, lowEnd ? 16 : 24),
    new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0, depthWrite: false })
  );
  c.glowRing.position.set(c.x, CFG.headY - 0.02, 0);
  root.add(c.glowRing);
});

/* ═══════════════════════════════════════════════════════════════════════
   FLOW PARTICLES (intake + exhaust)
   ═══════════════════════════════════════════════════════════════════════ */
function makeParticleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.65)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const particleTex = makeParticleTexture();

const PER_CYL = lowEnd ? 5 : 8;
const flowParticles = [];

CYLINDERS.forEach(c => {
  for (let i = 0; i < PER_CYL; i++) {
    const mat = new THREE.SpriteMaterial({
      map: particleTex, color: 0x38bdf8,
      transparent: true, opacity: 0,
      depthWrite: false
    });
    const s = new THREE.Sprite(mat);
    s.userData = {
      cyl: c.id,
      active: false, u: 0,
      direction: 1,   // +1 = downward (intake), −1 = upward (exhaust)
      speed: 0
    };
    s.visible = false;
    scene.add(s);
    flowParticles.push(s);
  }
});

function spawnFlow(cylId, direction) {
  /* Find an inactive sprite for this cylinder */
  for (const s of flowParticles) {
    if (s.userData.cyl !== cylId) continue;
    if (s.userData.active) continue;
    s.userData.active = true;
    s.userData.u = 0;
    s.userData.direction = direction;
    s.userData.speed = 0.85 + Math.random() * 0.45;
    s.material.color.setHex(direction > 0 ? 0x7fd6ff : 0xffb45c);
    s.material.opacity = 0.9;
    s.visible = true;
    return;
  }
}

function updateFlow(dt, pistonTopY, headY) {
  for (const s of flowParticles) {
    if (!s.userData.active) continue;
    s.userData.u += s.userData.speed * dt;
    if (s.userData.u >= 1) {
      s.userData.active = false;
      s.visible = false;
      continue;
    }
    const c = CYLINDERS.find(cc => cc.id === s.userData.cyl);
    const u = s.userData.u;
    const topY = headY - 0.10;
    const botY = pistonTopY + 0.08;

    if (s.userData.direction > 0) {
      /* Intake: entering from above, moving down toward piston */
      s.position.set(c.x, topY - u * (topY - botY), 0);
    } else {
      /* Exhaust: rising from piston, moving up out */
      s.position.set(c.x, botY + u * (topY - botY), 0);
    }

    const fade = Math.sin(u * Math.PI);
    s.material.opacity = 0.9 * fade;
    s.scale.setScalar(0.06 + 0.05 * fade);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   LABELS
   ═══════════════════════════════════════════════════════════════════════ */
const labels = Base.createLabelSystem();
labels.add('crank',   'Crankshaft');
labels.add('throw',   'Crank throw');
labels.add('cw',      'Counterweight');
labels.add('rod',     'Connecting rod');
labels.add('piston',  'Piston');
labels.add('rings',   'Piston rings');
labels.add('main',    'Main journal');
labels.add('cyl1',    'Cyl 1');
labels.add('cyl4',    'Cyl 4');

/* ═══════════════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = {
  overview: () => `
    <div class="al-sec">
      <h4>What it does</h4>
      <p>The crankshaft converts the piston's up–down motion into rotation. The connecting rod
      links the two: the small end pins to the piston, the big end wraps the crank throw. Every
      throw is offset from the crank axis by half the stroke.</p>
    </div>
    <div class="al-sec">
      <h4>Firing order 1-3-4-2</h4>
      <p>In an inline-4 the throws are paired. Pistons <b>1 &amp; 4</b> move together, and
      <b>2 &amp; 3</b> move half a revolution behind. This gives one power stroke every
      180° of crank — the smoothest possible balance for a 4-cylinder engine.</p>
    </div>
    <div class="al-sec">
      <h4>The four strokes</h4>
      <ul>
        <li><b>Intake</b> — piston moves down, filling the cylinder with air and fuel.</li>
        <li><b>Compression</b> — piston rises, squeezing the charge to ~1/10 of its volume.</li>
        <li><b>Power</b> — spark ignites the mixture; expanding gas drives the piston down.</li>
        <li><b>Exhaust</b> — piston rises again, pushing burnt gases out.</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>Key geometry</h4>
      <ul>
        <li><b>Stroke</b> — piston travel, TDC to BDC. Typically 70–100 mm on a car.</li>
        <li><b>Bore</b> — cylinder diameter. Bore/stroke ratio shapes an engine's character.</li>
        <li><b>Rod ratio</b> — rod length ÷ stroke, typically 3.2–4.0.</li>
        <li><b>Mean piston speed</b> = 2 × stroke × rpm ÷ 60 — the real limit on rpm.</li>
      </ul>
    </div>`,
  faults: () => `
    <div class="al-sec"><h4>Common faults</h4></div>
    <div class="al-fault">
      <div class="t">Worn crankshaft bearings</div>
      <div class="s">Deep knocking at idle, low oil pressure, metal in the oil.</div>
      <div class="c">Check: oil pressure hot, plastigauge on the journals vs spec.</div>
    </div>
    <div class="al-fault">
      <div class="t">Piston slap</div>
      <div class="s">Rattle that fades as the engine warms — common on high-mileage engines.</div>
      <div class="c">Check: bore wear with a dial gauge; measure piston-to-bore clearance.</div>
    </div>
    <div class="al-fault">
      <div class="t">Stuck or worn rings</div>
      <div class="s">Oil consumption, blue exhaust, low compression, high crankcase pressure.</div>
      <div class="c">Check: dry and wet compression test; leak-down test to localise valve vs ring.</div>
    </div>
    <div class="al-fault">
      <div class="t">Spun rod bearing</div>
      <div class="s">Sudden knocking, loss of oil pressure, no-start.</div>
      <div class="c">Check: rod bearing clearance and journal ovality; replace crank on the bench.</div>
    </div>`,
  quiz: () => `
    <div class="al-q" data-a="1">
      <div class="q">1. What does the crank throw offset define?</div>
      <button class="al-opt">Piston diameter</button>
      <button class="al-opt">Half the piston stroke</button>
      <button class="al-opt">Rod length</button>
      <div class="al-exp">The throw offset equals half the stroke. Moving from TDC to BDC shifts the throw from +r to −r, giving a total piston travel of 2r.</div>
    </div>
    <div class="al-q" data-a="2">
      <div class="q">2. In a 1-3-4-2 inline-4, which pistons move together?</div>
      <button class="al-opt">1 and 2</button>
      <button class="al-opt">2 and 4</button>
      <button class="al-opt">1 and 4, plus 2 and 3 half a revolution later</button>
      <div class="al-exp">Throws are paired. Pistons 1 and 4 go up together while 2 and 3 go down — giving even 180° firing intervals.</div>
    </div>
    <div class="al-q" data-a="0">
      <div class="q">3. What does mean piston speed tell you?</div>
      <button class="al-opt">The physical limit on rpm — above ~25 m/s ring sealing and lubrication break down</button>
      <button class="al-opt">The maximum torque output</button>
      <button class="al-opt">The fuel injection pulse width</button>
      <div class="al-exp">Mean piston speed = 2 × stroke × rpm ÷ 60. Production engines cap around 20–25 m/s. It is why shorter-stroke engines can rev higher.</div>
    </div>`
};

function readoutHTML() {
  return `<div class="al-read">
    <span class="k">Engine speed</span><span class="v hi" id="ro-rpm">—</span>
    <span class="k">Cycle angle</span><span class="v" id="ro-ca">—</span>
    <span class="k">Piston 1 pos.</span><span class="v" id="ro-p1">—</span>
    <span class="k">Rod ratio</span><span class="v" id="ro-rr">—</span>
    <span class="k">Mean piston speed</span><span class="v" id="ro-mps">—</span>
    <span class="k">Cyl 1 stroke</span><span class="v" id="ro-c1">—</span>
    <span class="k">Cyl 4 stroke</span><span class="v" id="ro-c4">—</span>
  </div>`;
}

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: 'Engine Mechanical',
    title:  'Crankshaft & Pistons',
    tabs: [
      { id: 'overview', label: 'Overview' },
      { id: 'faults',   label: 'Faults' },
      { id: 'quiz',     label: 'Self-check' }
    ],
    onTab: renderTab,
    badge: { text: 'Inline-4 · 1-3-4-2', color: CFG.accent },
    readout: readoutHTML()
  },
  chip: {
    label: 'Engine',
    value: '—',
    unit: ' rpm',
    bar: true,
    rows: [
      { id: 'c1', label: 'Cyl 1', value: '—' },
      { id: 'c2', label: 'Cyl 2', value: '—' }
    ],
    status: { text: 'Running' }
  },
  toolbar: {
    play: true,
    reset: true,
    speed: { label: 'Sim speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
    labels: true
  },
  widgets: {
    bl: {
      html: `<div class="al-w">
        <label for="rr-range">Rod ratio <b id="rr-out">3.4</b></label>
        <input id="rr-range" class="al-range" type="range" min="3.0" max="5.0" step="0.1"
               value="3.4" aria-label="Rod ratio">
      </div>`,
      caption: 'Geometry',
      onMount: mountRodWidget
    },
    br: {
      html: `<canvas id="timing-canvas" class="al-timing-canvas" width="300" height="140"
               aria-label="Four-stroke cycle timing diagram"></canvas>`,
      caption: 'Cycle · 720°',
      onMount: mountTimingWidget
    }
  }
});
ui.toolbar.setRpmLabel('rpm');

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);

tabHost.addEventListener('click', (e) => {
  const btn = e.target.closest('.al-opt');
  if (!btn) return;
  const q = btn.closest('.al-q');
  if (!q || q.classList.contains('done')) return;
  const answer = Number(q.dataset.a);
  q.classList.add('done');
  q.querySelectorAll('.al-opt').forEach((o, i) => {
    o.disabled = true;
    if (i === answer) o.classList.add('ok');
    else if (o === btn) o.classList.add('no');
  });
});

function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

function mountRodWidget(el) {
  const inp = el.querySelector('#rr-range');
  const out = el.querySelector('#rr-out');
  if (!inp || !out) return;
  inp.value = state.rodRatio;
  out.textContent = state.rodRatio.toFixed(1);
  inp.addEventListener('input', () => {
    state.rodRatio = Number(inp.value);
    out.textContent = state.rodRatio.toFixed(1);
    updateReadouts();
  });
}

/* ─── Timing canvas mount ─── */
let timingCanvas = null;
let timingCtx = null;
function mountTimingWidget(el) {
  timingCanvas = el.querySelector('#timing-canvas');
  if (!timingCanvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = timingCanvas.width;
  const cssH = timingCanvas.height;
  timingCanvas.style.width  = '100%';
  timingCanvas.style.height = 'auto';
  timingCanvas.width  = cssW * dpr;
  timingCanvas.height = cssH * dpr;
  timingCtx = timingCanvas.getContext('2d');
  timingCtx.scale(dpr, dpr);
  timingCanvas._cssW = cssW;
  timingCanvas._cssH = cssH;
}

/* ═══════════════════════════════════════════════════════════════════════
   PHYSICS
   ═══════════════════════════════════════════════════════════════════════ */
/* Slider-crank: pin position along the cylinder axis given crank angle */
function pinPosition(theta, r) {
  return r * Math.cos(theta);
}

function pistonPinY(theta, r, L) {
  const s = r * Math.sin(theta);
  const under = Math.max(0, L * L - s * s);
  return r * Math.cos(theta) + Math.sqrt(under);
}

/* Convert a global 720° cycle angle into the local cycle angle for a cylinder */
function localCycleDeg(globalDeg, fireOffset) {
  let local = globalDeg - fireOffset;
  local = ((local % CFG.CYCLE) + CFG.CYCLE) % CFG.CYCLE;
  return local;
}

/* Local cycle angle → stroke name */
function strokeFromLocal(deg) {
  if (deg < 180) return STROKE.power;         /* 0–180   — piston descending */
  if (deg < 360) return STROKE.exhaust;       /* 180–360 — piston rising */
  if (deg < 540) return STROKE.intake;        /* 360–540 — piston descending */
  return STROKE.compression;                   /* 540–720 — piston rising */
}

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
const ro = {
  rpm:  document.getElementById('ro-rpm'),
  ca:   document.getElementById('ro-ca'),
  p1:   document.getElementById('ro-p1'),
  rr:   document.getElementById('ro-rr'),
  mps:  document.getElementById('ro-mps'),
  c1:   document.getElementById('ro-c1'),
  c4:   document.getElementById('ro-c4')
};

function updateReadouts() {
  const rpm = Math.round(700 + state.speedMul * 5500);
  const totalRevs = t * CFG.cycleHz;
  const globalDeg = (totalRevs * 360) % CFG.CYCLE;
  const r = CFG.crankR;
  const L = r * state.rodRatio;

  /* Piston 1 (phase 0) */
  const theta = (totalRevs * Math.PI * 2);
  const pinY1 = pistonPinY(theta, r, L);
  const tdcY = r + L;
  const bdcY = -r + L;
  const fromTDC = (tdcY - pinY1) / (tdcY - bdcY) * 90;   /* 90 mm stroke */

  /* Mean piston speed */
  const meanPS = 2 * 0.090 * rpm / 60;

  if (ro.rpm) ro.rpm.textContent = rpm.toLocaleString() + ' rpm';
  if (ro.ca)  ro.ca.textContent  = globalDeg.toFixed(0) + '°';
  if (ro.p1)  ro.p1.textContent  = fromTDC.toFixed(1) + ' mm ↓';
  if (ro.rr)  ro.rr.textContent  = state.rodRatio.toFixed(2) + ' : 1';
  if (ro.mps) {
    ro.mps.textContent = meanPS.toFixed(2) + ' m/s';
    ro.mps.className = 'v ' + (meanPS > 22 ? 'crit' : meanPS > 16 ? 'warn' : 'ok');
  }

  const c1 = CYLINDERS[0];
  const c4 = CYLINDERS[3];
  const s1 = strokeFromLocal(localCycleDeg(globalDeg, c1.fireOffset));
  const s4 = strokeFromLocal(localCycleDeg(globalDeg, c4.fireOffset));

  if (ro.c1) {
    ro.c1.textContent = s1.name;
    ro.c1.className = 'v ' + (s1.name === 'Power' ? 'crit' : s1.name === 'Intake' ? 'ok' : s1.name === 'Compression' ? 'warn' : '');
  }
  if (ro.c4) {
    ro.c4.textContent = s4.name;
    ro.c4.className = 'v ' + (s4.name === 'Power' ? 'crit' : s4.name === 'Intake' ? 'ok' : s4.name === 'Compression' ? 'warn' : '');
  }

  ui.chip.setBig(rpm, ' rpm');
  ui.chip.set('c1', s1.name.slice(0, 8));
  ui.chip.set('c2', strokeFromLocal(localCycleDeg(globalDeg, CYLINDERS[1].fireOffset)).name.slice(0, 8));
  ui.chip.setBar((globalDeg / CFG.CYCLE) * 100, 'var(--al-accent)');
  ui.chip.setStatus('Cyl 1 · ' + s1.name, s1.name !== 'Power');

  drawTimingDiagram(globalDeg);
}

/* ═══════════════════════════════════════════════════════════════════════
   TIMING DIAGRAM (720° × 4 cylinders)
   ═══════════════════════════════════════════════════════════════════════ */
function drawTimingDiagram(globalDeg) {
  if (!timingCtx || !timingCanvas) return;
  const W = timingCanvas._cssW;
  const H = timingCanvas._cssH;
  const ctx = timingCtx;

  ctx.clearRect(0, 0, W, H);

  const padL = 22;      /* space for cylinder labels */
  const padR = 4;
  const padT = 12;
  const padB = 18;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const rowH = plotH / 4;
  const barH = rowH * 0.62;
  const barGap = (rowH - barH) / 2;

  /* Helper to draw a coloured segment on a row, handling wrap-around */
  function drawSegment(rowY, aDeg, bDeg, cssColour) {
    aDeg = ((aDeg % 720) + 720) % 720;
    bDeg = ((bDeg % 720) + 720) % 720;
    ctx.fillStyle = cssColour;

    if (aDeg <= bDeg) {
      const x1 = padL + (aDeg / 720) * plotW;
      const x2 = padL + (bDeg / 720) * plotW;
      ctx.fillRect(x1, rowY, x2 - x1, barH);
    } else {
      const x1 = padL + (aDeg / 720) * plotW;
      const x2 = padL + plotW;
      ctx.fillRect(x1, rowY, x2 - x1, barH);
      const x3 = padL;
      const x4 = padL + (bDeg / 720) * plotW;
      ctx.fillRect(x3, rowY, x4 - x3, barH);
    }
  }

  /* Draw one row per cylinder, top to bottom in cylinder number order */
  CYLINDERS.forEach((c, idx) => {
    const rowY = padT + idx * rowH + barGap;

    /* Row background (shows through gaps) */
    ctx.fillStyle = 'rgba(148, 163, 184, 0.08)';
    ctx.fillRect(padL, rowY, plotW, barH);

    const f = c.fireOffset;

    /* The four strokes */
    drawSegment(rowY, f,         f + 180, STROKE.power.css);       /* Power */
    drawSegment(rowY, f + 180,   f + 360, STROKE.exhaust.css);     /* Exhaust */
    drawSegment(rowY, f + 360,   f + 540, STROKE.intake.css);      /* Intake */
    drawSegment(rowY, f + 540,   f + 720, STROKE.compression.css); /* Compression */

    /* Cylinder number label on the left */
    ctx.fillStyle = 'rgba(226, 232, 240, 0.85)';
    ctx.font = 'bold 9px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('C' + c.id, padL - 4, rowY + barH / 2);
  });

  /* Vertical grid every 180° */
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
  ctx.lineWidth = 1;
  for (let d = 0; d <= 720; d += 180) {
    const x = padL + (d / 720) * plotW;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + plotH);
    ctx.stroke();
  }

  /* Live marker */
  const curX = padL + (globalDeg / 720) * plotW;
  ctx.strokeStyle = '#ca8a04';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(curX, padT);
  ctx.lineTo(curX, padT + plotH);
  ctx.stroke();

  /* X-axis tick labels */
  ctx.fillStyle = 'rgba(148, 163, 184, 0.60)';
  ctx.font = '8px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  [0, 180, 360, 540, 720].forEach(d => {
    const x = padL + (d / 720) * plotW;
    ctx.fillText(d + '°', x, padT + plotH + 4);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      state.rodRatio = 3.4;
      const inp = document.getElementById('rr-range');
      const out = document.getElementById('rr-out');
      if (inp) inp.value = 3.4;
      if (out) out.textContent = '3.4';
      updateReadouts();
    }
  }
});
bridge.ready();
bridge.setStatus('Crankshaft ready', '#ca8a04');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Gas colour transitions — how fast the emissive follows the stroke change */
const GAS_INTENSITY = {
  intake:      0.35,
  compression: 0.55,
  power:       1.05,
  exhaust:     0.30
};

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  t += dt * sp;

  const totalRevs = t * CFG.cycleHz;
  const theta = totalRevs * Math.PI * 2;
  const crankRad = theta % (Math.PI * 2);
  const globalDeg = (totalRevs * 360) % CFG.CYCLE;

  const r = CFG.crankR;
  const L = r * state.rodRatio;

  /* ── Rotate the crankshaft as a rigid body ─────────────────────── */
  crank.rotation.x = crankRad;

  /* ── Update each piston, rod, gas volume ──────────────────────── */
  CYLINDERS.forEach(c => {
    const phaseOffset = c.pistonPhase * Math.PI * 2;
    const thetaC = theta + phaseOffset;

    /* Pin position along Y */
    const pinY = pistonPinY(thetaC, r, L);
    const pinZ = r * Math.sin(thetaC);

    /* Piston group */
    c.pistonG.position.set(c.x, pinY, 0);

    /* Rod: from pin (c.x, pinY, pinZ) → small end (c.x, pinY_piston, 0)
       The small end is at the piston centre; visually we offset it slightly
       toward the piston top so the rod looks like it attaches at the pin. */
    const smallEndY = pinY + 0.02;
    const p0 = new THREE.Vector3(c.x, pinY, pinZ);
    const p1 = new THREE.Vector3(c.x, smallEndY, 0);
    const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(p1, p0);
    const len = dir.length();

    c.rod.position.copy(mid);
    c.rod.scale.set(1, len, 1);
    c.rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    c.smallEnd.position.copy(p1);
    c.bigEnd.position.copy(p0);

    /* ── Gas volume ─────────────────────────────────────────────── */
    const pistonTopY = pinY + CFG.pistonHalf;
    const gasH = Math.max(0.05, CFG.headY - pistonTopY - 0.05);
    c.gas.scale.y = gasH;
    c.gas.position.y = pistonTopY;

    /* ── Stroke from cycle phase ────────────────────────────────── */
    const localDeg = localCycleDeg(globalDeg, c.fireOffset);
    const st = strokeFromLocal(localDeg);

    /* Set gas colour + intensity */
    c.gasMat.color.setHex(st.colour);
    c.gasMat.emissive.setHex(st.colour);
    const targetIntensity = GAS_INTENSITY[st.name.toLowerCase()] || 0.4;
    /* Smooth transition */
    c.gasMat.emissiveIntensity += (targetIntensity - c.gasMat.emissiveIntensity) * Math.min(1, dt * 6);
    c.gasMat.opacity = 0.35 + 0.25 * c.gasMat.emissiveIntensity;

    /* Power-stroke glow ring */
    const glowOn = st.name === 'Power' ? 0.85 : 0.0;
    c.glowRing.material.opacity += (glowOn - c.glowRing.material.opacity) * Math.min(1, dt * 8);

    /* ── Flow particles ─────────────────────────────────────────── */
    /* Spawn a few per frame based on which stroke we're in */
    if (state.playing && sp > 0) {
      const spawnRate = 18 * Math.abs(sp);
      c._spawnAcc = (c._spawnAcc || 0) + spawnRate * dt;

      if (st.name === 'Intake') {
        while (c._spawnAcc >= 1) {
          c._spawnAcc -= 1;
          spawnFlow(c.id, +1);   /* down */
        }
      } else if (st.name === 'Exhaust') {
        while (c._spawnAcc >= 1) {
          c._spawnAcc -= 1;
          spawnFlow(c.id, -1);   /* up */
        }
      } else {
        c._spawnAcc = 0;
      }
    }
  });

  /* Update all flow sprites relative to their piston position */
  for (const s of flowParticles) {
    if (!s.userData.active) continue;
    const c = CYLINDERS.find(cc => cc.id === s.userData.cyl);
    if (!c) { s.userData.active = false; s.visible = false; continue; }
    const phaseOffset = c.pistonPhase * Math.PI * 2;
    const thetaC = theta + phaseOffset;
    const pinY = pistonPinY(thetaC, r, L);
    const pistonTopY = pinY + CFG.pistonHalf;
    updateFlow(dt, pistonTopY, CFG.headY);
  }

  /* ── Labels ───────────────────────────────────────────────────── */
  labels.hideAll();
  if (state.showLabels) {
    labels.project('crank',  tmp.set(-2.20, 0.35, 0),    camera, wrap);
    labels.project('throw',  tmp.set(0.55, -r, 0.35),    camera, wrap);
    labels.project('cw',     tmp.set(1.65, -r * 0.8, 0), camera, wrap);
    labels.project('rod',    tmp.set(-0.55, 1.20, 0.20), camera, wrap);
    labels.project('piston', tmp.set(-1.65, CFG.headY - 0.55, 0), camera, wrap);
    labels.project('rings',  tmp.set(-1.65, CFG.headY - 0.90, 0.35), camera, wrap);
    labels.project('main',   tmp.set(0, 0.35, 0),        camera, wrap);
    labels.project('cyl1',   tmp.set(-1.65, CFG.headY + 0.35, 0), camera, wrap);
    labels.project('cyl4',   tmp.set( 1.65, CFG.headY + 0.35, 0), camera, wrap);
  }

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.10) { roClock = 0; updateReadouts(); }
}

if (reduced) {
  setInterval(() => renderer.render(scene, camera), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts();
</script>
</body>
</html>
