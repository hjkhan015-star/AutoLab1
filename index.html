<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<meta name="description" content="Interactive 3D automotive learning lab.">
<meta name="author" content="Hassan J Khan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto Lab">
<title>Auto Lab</title>

<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" crossorigin>
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js" crossorigin>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   Shell-only styles — home screen, module frame, pill, sheet.
   These are not part of app.css because modules never render them.
   ═══════════════════════════════════════════════════════════════════════ */
@layer shell {
  #home-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    z-index: 1;
    overflow: hidden;
    transition: transform var(--dur-slow) var(--ease-in-out),
                opacity var(--dur-slow) var(--ease-in-out),
                filter var(--dur-slow) var(--ease-in-out);
    transform-origin: center top;
  }
  #home-screen.behind {
    transform: scale(.94) translateY(8px);
    opacity: 0;
    filter: blur(10px);
    pointer-events: none;
  }

  /* ── Header ── */
  .home-header {
    flex: 0 0 auto;
    padding: calc(var(--s-4) + var(--safe-t)) var(--s-5) var(--s-3);
    background: linear-gradient(180deg,
      color-mix(in oklch, var(--bg) 100%, transparent) 0%,
      color-mix(in oklch, var(--bg) 82%, transparent) 78%,
      transparent 100%);
    z-index: 5;
  }
  @media (min-width: 768px) {
    .home-header { max-width: 1100px; margin: 0 auto; width: 100%; }
  }

  .header-row { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }

  .brand-mark {
    width: 42px; height: 42px;
    flex: 0 0 auto;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a0d13;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--accent) 55%, transparent);
    position: relative;
    overflow: hidden;
  }
  .brand-mark::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      transparent 40%,
      color-mix(in oklch, white 45%, transparent) 50%,
      transparent 60%);
    transform: translateX(-130%);
    animation: sheen 3.6s var(--ease-in-out) infinite;
  }
  @keyframes sheen {
    0%, 62% { transform: translateX(-130%); }
    100%    { transform: translateX(130%); }
  }
  .brand-mark svg { width: 24px; height: 24px; }

  .brand-copy { flex: 1; min-width: 0; }
  .brand-title {
    font-size: 19px; font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .brand-title .brand-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    display: inline-block;
    transform: translateY(-4px);
  }
  .brand-sub {
    font-size: 11.5px; color: var(--text-mute);
    margin-top: 3px; font-weight: 500;
  }

  #install-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: var(--r-sm);
    border: 1px solid color-mix(in oklch, var(--accent) 42%, transparent);
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    color: var(--accent);
    font-size: 11.5px; font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
  }
  #install-btn:active { transform: scale(.95); }
  #install-btn svg { width: 14px; height: 14px; }
  #install-btn[hidden] { display: none; }

  /* ── Search ── */
  .search-wrap {
    position: relative;
    display: flex; align-items: center;
    height: 44px;
    padding: 0 var(--s-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  .search-wrap:focus-within {
    background: var(--surface-3);
    border-color: var(--border-focus);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .search-wrap svg {
    width: 16px; height: 16px;
    color: var(--text-mute);
    flex: 0 0 auto;
    margin-right: var(--s-2);
  }
  .search-wrap input {
    flex: 1; min-width: 0;
    background: transparent;
    border: 0; outline: none;
    color: var(--text);
    font-size: 15px; font-weight: 500;
  }
  .search-wrap input::placeholder { color: var(--text-mute); font-weight: 400; }
  @media (max-width: 720px) { .search-wrap input { font-size: 16px; } }

  /* ── Main scroll area ── */
  .home-main {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: var(--s-2) 0 calc(96px + var(--safe-b));
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .home-main::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) {
    .home-main { padding-bottom: var(--s-8); max-width: 1100px; margin: 0 auto; width: 100%; }
  }

  .section-title {
    padding: var(--s-4) var(--s-5) var(--s-2);
    font-size: 12.5px; font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-wrap: balance;
  }

  /* ── Module grid ── */
  .module-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--s-3);
    padding: 0 var(--s-5);
  }
  @media (min-width: 520px) { .module-grid { grid-template-columns: repeat(3, 1fr); gap: var(--s-4); } }
  @media (min-width: 768px) { .module-grid { grid-template-columns: repeat(4, 1fr); gap: var(--s-4); } }
  @media (min-width: 1200px){ .module-grid { grid-template-columns: repeat(6, 1fr); } }

  .module-card {
    position: relative;
    aspect-ratio: 1;
    padding: var(--s-3) var(--s-2);
    border-radius: var(--r-lg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--s-2);
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    color: var(--text);
    background: color-mix(in oklch, var(--c, var(--accent)) 10%, var(--surface-2));
    border: 1px solid color-mix(in oklch, var(--c, var(--accent)) 22%, transparent);
    transition: transform var(--dur-fast) var(--ease-spring),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                background var(--dur-fast) var(--ease-out);
  }
  .module-card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%,
      color-mix(in oklch, var(--c, var(--accent)) 34%, transparent) 0%,
      transparent 62%);
    opacity: .55;
    transition: opacity var(--dur-base) var(--ease-out);
    pointer-events: none;
  }
  .module-card:hover {
    border-color: color-mix(in oklch, var(--c, var(--accent)) 48%, transparent);
    box-shadow: 0 16px 48px -16px color-mix(in oklch, var(--c, var(--accent)) 65%, transparent);
  }
  .module-card:hover::before { opacity: .95; }
  .module-card:active { transform: scale(.955); }

  .module-card .card-icon {
    position: relative;
    width: 38px; height: 38px;
    color: var(--c, var(--accent));
    filter: drop-shadow(0 4px 14px color-mix(in oklch, var(--c, var(--accent)) 55%, transparent));
    z-index: 1;
  }
  .module-card .card-icon svg { width: 100%; height: 100%; display: block; }
  .module-card .card-label {
    position: relative;
    font-size: 12.5px; font-weight: 700;
    text-align: center;
    line-height: 1.2;
    letter-spacing: -.01em;
    z-index: 1;
    text-wrap: balance;
  }
  .module-card .card-sub {
    position: relative;
    font-size: 10px; font-weight: 500;
    color: var(--text-mute);
    text-align: center;
    line-height: 1.25;
    margin-top: -2px;
    z-index: 1;
  }

  /* ── Recent list ── */
  .recent-list {
    display: flex; flex-direction: column;
    gap: var(--s-2);
    padding: 0 var(--s-5);
  }
  .recent-item {
    display: flex; align-items: center;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    border-radius: var(--r-md);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
    touch-action: manipulation;
  }
  .recent-item:hover { background: var(--surface-3); border-color: var(--border-hi); }
  .recent-item:active { transform: scale(.98); }
  .recent-item .r-icon {
    width: 36px; height: 36px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    background: color-mix(in oklch, var(--c, var(--accent)) 18%, transparent);
    color: var(--c, var(--accent));
    border: 1px solid color-mix(in oklch, var(--c, var(--accent)) 28%, transparent);
  }
  .recent-item .r-icon svg { width: 22px; height: 22px; }
  .recent-item .r-copy { flex: 1; min-width: 0; }
  .recent-item .r-title {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent-item .r-sub {
    font-size: 11.5px; color: var(--text-mute);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent-item .r-arrow { color: var(--text-mute); flex: 0 0 auto; }
  .recent-item .r-arrow svg { width: 16px; height: 16px; }

  /* ── Empty state ── */
  .empty-state {
    padding: var(--s-10) var(--s-6);
    text-align: center;
    color: var(--text-mute);
  }
  .empty-state svg { width: 52px; height: 52px; opacity: .35; margin: 0 auto var(--s-4); }
  .empty-state .e-title { font-size: 15px; font-weight: 700; color: var(--text-dim); margin-bottom: var(--s-1); }
  .empty-state .e-body { font-size: 13px; line-height: 1.5; max-width: 280px; margin: 0 auto; }

  /* ── About ── */
  .about-content { padding: var(--s-2) var(--s-5) var(--s-10); max-width: 640px; margin: 0 auto; }
  .about-hero {
    position: relative;
    padding: var(--s-6) var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-xl);
    overflow: hidden;
    background:
      radial-gradient(140% 120% at 0% 0%, color-mix(in oklch, var(--accent) 24%, transparent) 0%, transparent 55%),
      radial-gradient(140% 120% at 100% 100%, color-mix(in oklch, var(--accent-2) 24%, transparent) 0%, transparent 55%),
      var(--surface-2);
    border: 1px solid var(--border);
  }
  .about-hero .ah-eyebrow {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: var(--s-2);
  }
  .about-hero h2 {
    font-size: 22px; font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.15;
    margin-bottom: var(--s-2);
    text-wrap: balance;
  }
  .about-hero p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); max-width: 440px; }
  .about-hero .ah-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-4); }
  .about-hero .ah-tag {
    font-size: 10.5px; font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--r-pill);
    background: color-mix(in oklch, var(--accent) 16%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in oklch, var(--accent) 32%, transparent);
  }
  .about-card {
    padding: var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-lg);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .about-card h3 { font-size: 16px; font-weight: 800; margin-bottom: var(--s-2); letter-spacing: -.01em; }
  .about-card p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
  .about-card p + p { margin-top: var(--s-2); }
  .about-card strong { color: var(--text); font-weight: 700; }
  .maker-card {
    position: relative;
    display: flex; align-items: center;
    gap: var(--s-4);
    padding: var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-xl);
    overflow: hidden;
    background: linear-gradient(135deg,
      color-mix(in oklch, var(--accent) 14%, transparent) 0%,
      color-mix(in oklch, var(--accent-2) 12%, transparent) 100%);
    border: 1px solid color-mix(in oklch, var(--accent) 26%, transparent);
  }
  .maker-card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%,
      color-mix(in oklch, var(--accent-2) 32%, transparent) 0%,
      transparent 55%);
    opacity: .6;
    pointer-events: none;
  }
  .maker-avatar {
    position: relative;
    width: 56px; height: 56px;
    flex: 0 0 auto;
    border-radius: var(--r-md);
    display: grid; place-items: center;
    font-size: 20px; font-weight: 900;
    letter-spacing: -.04em;
    color: #0a0d13;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 28px -8px color-mix(in oklch, var(--accent) 65%, transparent);
    z-index: 1;
  }
  .maker-copy { position: relative; flex: 1; min-width: 0; z-index: 1; }
  .maker-role {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .maker-name { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .maker-tag { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .about-credits {
    text-align: center;
    padding: var(--s-6) var(--s-5) 0;
    font-size: 11.5px; color: var(--text-mute);
    line-height: 1.7;
  }
  .about-credits .dot {
    display: inline-block;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--text-mute);
    margin: 0 6px;
    transform: translateY(-3px);
    opacity: .5;
  }
  .about-credits .sig { font-weight: 700; color: var(--text-dim); letter-spacing: .01em; }

  /* ── Bottom nav ── */
  #bottom-nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch;
    padding: 6px 10px calc(6px + var(--safe-b));
    background: color-mix(in oklch, var(--bg) 92%, transparent);
    backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    border-top: 1px solid var(--border);
    z-index: 50;
  }
  @media (min-width: 768px) {
    #bottom-nav {
      max-width: 640px; margin: 0 auto;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
  .nav-tab {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    padding: var(--s-2) var(--s-1);
    border-radius: var(--r-sm);
    color: var(--text-mute);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .01em;
    transition: color var(--dur-base) var(--ease-out),
                background var(--dur-base) var(--ease-out);
  }
  .nav-tab svg { width: 22px; height: 22px; transition: transform var(--dur-base) var(--ease-spring); }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active svg { transform: translateY(-1px); }
  .nav-tab:active { background: var(--surface-hover); }

  /* ═══════════════════════════════════════════════════════════════════
     MODULE SCREEN
     ═══════════════════════════════════════════════════════════════════ */
  #module-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform var(--dur-slow) var(--ease-in-out);
    background: var(--bg);
    z-index: 100;
    overflow: hidden;
    will-change: transform;
  }
  #module-screen.active { transform: translateX(0); }

  .floating-btn {
    position: absolute;
    top: calc(var(--s-3) + var(--safe-t));
    width: 42px; height: 42px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    background: color-mix(in oklch, var(--bg-elev) 90%, transparent);
    border: 1px solid var(--border-hi);
    backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    box-shadow: var(--shadow-sm);
    color: var(--text);
    z-index: 22;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
    touch-action: manipulation;
  }
  .floating-btn:hover { background: var(--bg-elev); }
  .floating-btn:active { transform: scale(.92); }
  .floating-btn svg { width: 20px; height: 20px; }
  #btn-back { left: calc(var(--s-3) + var(--safe-l)); }
  #btn-more { right: calc(var(--s-3) + var(--safe-r)); }

  #module-frame-host { position: absolute; inset: 0; background: var(--bg); }
  #module-frame-host iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: var(--bg);
    display: none;
  }
  #module-frame-host iframe.active { display: block; }

  /* ── Floating pill ── */
  #module-pill {
    position: absolute;
    left: 50%;
    bottom: calc(var(--s-4) + var(--safe-b));
    transform: translateX(-50%);
    display: flex; align-items: center;
    gap: 3px;
    padding: 5px;
    background: color-mix(in oklch, var(--bg-elev) 90%, transparent);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-lg);
    backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    box-shadow: var(--shadow-lg);
    z-index: 25;
    max-width: calc(100% - var(--s-5));
    overflow-x: auto;
    scrollbar-width: none;
    transition: transform var(--dur-slow) var(--ease-in-out),
                opacity var(--dur-base) var(--ease-out);
  }
  #module-pill::-webkit-scrollbar { display: none; }
  #module-pill.hidden {
    transform: translateX(-50%) translateY(120%);
    opacity: 0;
    pointer-events: none;
  }

  .pill-btn {
    width: 38px; height: 38px;
    flex: 0 0 auto;
    border-radius: var(--r-sm);
    display: grid; place-items: center;
    color: var(--text);
    background: transparent;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring),
                color var(--dur-fast) var(--ease-out);
    touch-action: manipulation;
  }
  .pill-btn:hover { background: var(--surface-hover); }
  .pill-btn:active { transform: scale(.90); }
  .pill-btn svg { width: 18px; height: 18px; }
  .pill-btn.active {
    background: color-mix(in oklch, var(--accent) 22%, transparent);
    color: var(--accent);
  }

  .pill-divider {
    width: 1px; height: 20px;
    background: var(--border-hi);
    margin: 0 3px;
    flex: 0 0 auto;
  }

  .pill-speed {
    display: flex; align-items: center;
    padding: 0 6px 0 3px;
    gap: 5px;
  }
  .pill-speed svg { width: 14px; height: 14px; color: var(--text-mute); }
  .pill-speed input[type="range"] {
    width: clamp(56px, 16vw, 110px);
    accent-color: var(--accent);
    height: 26px;
    cursor: pointer;
  }
  @media (max-width: 640px) {
    #pill-wire, #pill-xray { display: none; }
    #module-pill { gap: 2px; }
    .pill-divider { margin: 0 2px; }

  #bottom-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: 560px; margin: 0 auto;
    padding: var(--s-2) var(--s-5) calc(var(--s-6) + var(--safe-b));

    border: 1px solid var(--border);

    border-radius: var(--r-xl) var(--r-xl) 0 0;

    transition: transform var(--dur-slow) var(--ease-in-out);
    z-index: 201;

    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;

  .sheet-grabber {

<script>
/* ═══════════════════════════════════════════════════════════════════════
   perf-guard — inlined. Pauses off-screen iframes to save battery.
   Injected into every iframe on load, then resumed/paused based on
   its .active class.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var HOST_ID = 'module-frame-host';

  var CONTROLLER = [
    '(function () {',
    '  if (window.__autolabPerfGuard) return;',
    '  window.__autolabPerfGuard = true;',
    '  var raf = window.requestAnimationFrame.bind(window);',
    '  var caf = window.cancelAnimationFrame.bind(window);',
    '  var paused = false;',
    '  var parked = new Map();',
    '  var uid = 0;',
    '  window.requestAnimationFrame = function (cb) {',
    '    if (!paused) return raf(cb);',
    '    var id = ++uid;',
    '    parked.set(id, cb);',
    '    return id;',
    '  };',
    '  window.cancelAnimationFrame = function (id) {',
    '    if (parked.has(id)) { parked.delete(id); return; }',
    '    return caf(id);',
    '  };',
    '  function resume() {',
    '    if (!paused) return;',
    '    paused = false;',
    '    var cbs = [];',
    '    parked.forEach(function (cb) { cbs.push(cb); });',
    '    parked.clear();',
    '    for (var i = 0; i < cbs.length; i++) raf(cbs[i]);',
    '  }',
    '  window.addEventListener("message", function (e) {',
    '    var d = e.data;',
    '    if (!d || d.source !== "auto-shell") return;',
    '    if (d.action === "perf-pause")  { paused = true; return; }',
    '    if (d.action === "perf-resume") { resume(); }',
    '  });',
    '  try {',
    '    window.parent.postMessage(',
    '      { source: "auto-module-perf", action: "perf-ready" }, "*");',
    '  } catch (_) {}',
    '})();'
  ].join('\n');

  function inject(iframe) {
    var doc;
    try { doc = iframe.contentDocument; } catch (_) { return false; }
    if (!doc || !doc.documentElement) return false;
    if (doc.getElementById('autolab-perf-guard')) return true;
    try {
      var s = doc.createElement('script');
      s.id = 'autolab-perf-guard';
      s.textContent = CONTROLLER;
      (doc.head || doc.documentElement).appendChild(s);
      return true;
    } catch (_) { return false; }
  }
  function send(iframe, action) {
    try {
      iframe.contentWindow.postMessage({ source: 'auto-shell', action: action }, '*');
    } catch (_) {}
  }
  function sync(iframe) {
    if (!inject(iframe)) return false;
    send(iframe, iframe.classList.contains('active') ? 'perf-resume' : 'perf-pause');
    return true;
  }
  function retry(iframe) {
    var tries = 0;
    (function attempt() {
      if (sync(iframe)) return;
      if (++tries > 150) return;
      setTimeout(attempt, 30);
    })();
  }
  function watch(iframe) {
    if (iframe.__perfWatched) return;
    iframe.__perfWatched = true;
    retry(iframe);
    iframe.addEventListener('load', function () { retry(iframe); });
    new MutationObserver(function () { sync(iframe); })
      .observe(iframe, { attributes: true, attributeFilter: ['class'] });
  }
  function findBySource(src) {
    var host = document.getElementById(HOST_ID);
    if (!host) return null;
    var list = host.querySelectorAll('iframe');
    for (var i = 0; i < list.length; i++) {
      try { if (list[i].contentWindow === src) return list[i]; } catch (_) {}
    }
    return null;
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'auto-module-perf') return;
    if (d.action !== 'perf-ready') return;
    var fr = findBySource(e.source);
    if (fr) sync(fr);
  });
  function start() {
    var host = document.getElementById(HOST_ID);
    if (!host) { setTimeout(start, 200); return; }
    new MutationObserver(function () {
      var list = host.querySelectorAll('iframe');
      for (var i = 0; i < list.length; i++) watch(list[i]);
    }).observe(host, { childList: true });
    var list = host.querySelectorAll('iframe');
    for (var i = 0; i < list.length; i++) watch(list[i]);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>

    try { var r = localStorage.getItem(PREF_KEY); return r ? JSON.parse(r) : null; }

  }

    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    } catch (_) {}

    wireframe: !!savedPrefs.wireframe,

  };
  var iframes = Object.create(null);

  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({
        theme: state.theme, wireframe: state.wireframe, xray: state.xray
      }));
    } catch (_) {}
  }
  function loadRecents() {
    try {
      var r = localStorage.getItem('autolab.recents');
      if (!r) return [];
      var a = JSON.parse(r);
      if (!Array.isArray(a)) return [];
      return a.filter(function (id) { return modules.some(function (m) { return m.id === id; }); }).slice(0, 6);
    } catch (_) { return []; }
  }
  function pushRecent(id) {
    var a = state.recents.filter(function (x) { return x !== id; });
    a.unshift(id);
    state.recents = a.slice(0, 6);
    try { localStorage.setItem('autolab.recents', JSON.stringify(state.recents)); } catch (_) {}
  }

  /* ─── Embed-fix: for modules that DON'T use kit.js, keep the shell
       from fighting with their layout. Migrated modules carry the
       `uses-ui-kit` class (set by kit.js) and app.css handles them. */
  function injectEmbedFix(fr) {
    try {
      var doc = fr.contentDocument;
      if (!doc || !doc.body) return;
      doc.body.classList.add('embedded');
      try {
        doc.documentElement.classList.toggle('light-theme', state.theme === 'light');
        doc.body.classList.toggle('light-theme', state.theme === 'light');
      } catch (_) {}
      /* Migrated modules: app.css + kit.js do everything. */
      if (doc.body.classList.contains('uses-ui-kit')) return;
      /* Legacy modules: nothing else to inject — app.css's [embed] layer
         already handles `body.embedded:not(.uses-ui-kit)` selectors. */
    } catch (_) {}
  }

  function ensureIframe(mod) {
    if (iframes[mod.id]) return iframes[mod.id];
    var fr = document.createElement('iframe');
    fr.title = mod.title;
    fr.dataset.module = mod.id;
    fr.loading = 'eager';
    fr.setAttribute('allow', 'autoplay; fullscreen');
    fr.src = mod.file;
    fr.addEventListener('load', function () {
      injectEmbedFix(fr);
      var nudge = function () {
        try { fr.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {}
        try { if (fr.contentWindow.document) fr.contentWindow.document.dispatchEvent(new Event('resize')); } catch (_) {}
      };
      nudge();
      setTimeout(nudge, 80);
      setTimeout(nudge, 320);
      sendAllCommands(mod.id);
    });
    frameHost.appendChild(fr);
    iframes[mod.id] = fr;
    return fr;
  }

  function postTo(id, msg) {
    var fr = iframes[id];
    if (!fr || !fr.contentWindow) return;
    try {
      fr.contentWindow.postMessage(Object.assign({ source: 'auto-shell', moduleId: id }, msg), '*');
    } catch (_) {}
  }
  function sendAllCommands(id) {
    var fr = iframes[id];
    if (!fr) return;
    var win = fr.contentWindow;
    if (!win) return;
    var ready = false;
    try { ready = !!(win.document && win.document.body); } catch (_) {}
    if (!ready) { fr.addEventListener('load', function () { sendAllCommands(id); }, { once: true }); return; }
    postTo(id, { type: 'command', action: 'setPlaying',   value: state.playing });
    postTo(id, { type: 'command', action: 'setSpeed',     value: state.speed });
    postTo(id, { type: 'command', action: 'setLabels',    value: state.labels });
    postTo(id, { type: 'command', action: 'setGas',       value: state.gas });
    postTo(id, { type: 'command', action: 'setTheme',     value: state.theme });
    postTo(id, { type: 'command', action: 'setWireframe', value: state.wireframe });
    postTo(id, { type: 'command', action: 'setXRay',      value: state.xray });
  }

  function svgWrap(inner) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '1.7');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    s.innerHTML = inner || '';
    return s;
  }

  /* ─── Home rendering ─── */
  function renderHome(tab) {
    state.tab = tab;
    document.querySelectorAll('.nav-tab').forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    homeMain.innerHTML = '';
    if (tab === 'home') renderAllModules();
    else if (tab === 'recents') renderRecents();
    else if (tab === 'about') renderAbout();
  }

  function buildCard(mod) {
    var card = document.createElement('button');
    card.className = 'module-card';
    card.style.setProperty('--c', mod.color || 'var(--accent)');
    card.setAttribute('aria-label', mod.title);
    var iconBox = document.createElement('div');
    iconBox.className = 'card-icon';
    iconBox.appendChild(svgWrap(mod.icon || ''));
    card.appendChild(iconBox);
    var lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = mod.label || mod.title;
    card.appendChild(lbl);
    var sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = (mod.subtitle || '').split('·')[0].trim();
    card.appendChild(sub);
    card.addEventListener('click', function () { openModule(mod.id); });
    return card;
  }

  function renderAllModules() {
    var q = (searchInput.value || '').trim().toLowerCase();
    var filtered = q
      ? modules.filter(function (m) {
          return m.title.toLowerCase().indexOf(q) >= 0 ||
                 (m.subtitle || '').toLowerCase().indexOf(q) >= 0 ||
                 (m.label || '').toLowerCase().indexOf(q) >= 0;
        })
      : modules;

    if (state.recents.length && !q) {
      var st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = 'Jump back in';
      homeMain.appendChild(st);
      var list = document.createElement('div');
      list.className = 'recent-list';
      state.recents.slice(0, 2).forEach(function (id) {
        var m = modules.find(function (x) { return x.id === id; });
        if (m) list.appendChild(buildRecentItem(m));
      });
      homeMain.appendChild(list);
    }

    var st2 = document.createElement('div');
    st2.className = 'section-title';
    st2.textContent = q ? ('Results (' + filtered.length + ')') : 'All modules';
    homeMain.appendChild(st2);

    if (!filtered.length) {
      homeMain.appendChild(buildEmptyState('No matches', 'Nothing found for "' + searchInput.value + '". Try another word.'));
      return;
    }
    var grid = document.createElement('div');
    grid.className = 'module-grid';
    filtered.forEach(function (m) { grid.appendChild(buildCard(m)); });
    homeMain.appendChild(grid);
  }

  function buildRecentItem(mod) {
    var el = document.createElement('button');
    el.className = 'recent-item';
    el.style.setProperty('--c', mod.color || 'var(--accent)');
    var iconBox = document.createElement('div');
    iconBox.className = 'r-icon';
    iconBox.appendChild(svgWrap(mod.icon || ''));
    el.appendChild(iconBox);
    var copy = document.createElement('div');
    copy.className = 'r-copy';
    var t = document.createElement('div');
    t.className = 'r-title'; t.textContent = mod.title;
    var s = document.createElement('div');
    s.className = 'r-sub'; s.textContent = mod.subtitle || '';
    copy.appendChild(t); copy.appendChild(s);
    el.appendChild(copy);
    var arrow = document.createElement('div');
    arrow.className = 'r-arrow';
    arrow.appendChild(svgWrap('<path d="M9 6l6 6-6 6"/>'));
    el.appendChild(arrow);
    el.addEventListener('click', function () { openModule(mod.id); });
    return el;
  }

  function buildEmptyState(title, body) {
    var el = document.createElement('div');
    el.className = 'empty-state';
    var icon = svgWrap('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18M8 14h3"/>');
    icon.setAttribute('stroke-width', '1.5');
    el.appendChild(icon);
    var t = document.createElement('div');
    t.className = 'e-title'; t.textContent = title;
    var b = document.createElement('div');
    b.className = 'e-body'; b.textContent = body;
    el.appendChild(t); el.appendChild(b);
    return el;
  }

  function renderRecents() {
    if (!state.recents.length) {
      homeMain.appendChild(buildEmptyState('Nothing here yet', 'Modules you open will appear here for quick access.'));
      return;
    }
    var st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = 'Recently opened';
    homeMain.appendChild(st);
    var list = document.createElement('div');
    list.className = 'recent-list';
    state.recents.forEach(function (id) {
      var m = modules.find(function (x) { return x.id === id; });
      if (m) list.appendChild(buildRecentItem(m));
    });
    homeMain.appendChild(list);
  }

  function renderAbout() {
    var wrap = document.createElement('div');
    wrap.className = 'about-content';
    wrap.innerHTML = [
      '<div class="about-hero">',
      '  <div class="ah-eyebrow">Auto Lab · 3D Learning</div>',
      '  <h2>An interactive lab for the machines that move us.</h2>',

      '    <span class="ah-tag">Offline Ready</span>',
      '    <span class="ah-tag">Installable</span>',
      '    <span class="ah-tag">No Ads</span>',
      '  </div>',
      '</div>',
      '<div class="about-card">',
      '  <h3>How to use</h3>',
      '  <p><strong>Tap any module</strong> to open it. Inside, drag the 3D view to orbit, pinch to zoom, and use the floating controls at the bottom.</p>',

      '  <div class="maker-avatar">HK</div>',

      '    <div class="maker-role">Designed &amp; Developed by</div>',
      '    <div class="maker-name">Hassan J Khan</div>',

      '  </div>',
      '</div>',
      '<div class="about-card">',
      '  <h3>Built with</h3>',
      '  <p>Real-time 3D by <strong>Three.js</strong>. Zero external UI frameworks — just clean vanilla JavaScript, tuned for smooth performance on mobile.</p>',
      '  <p>Runs entirely in your browser. Install it to your home screen and it works fully offline.</p>',
      '</div>',
      '<div class="about-credits">',
      '  <span class="sig">Auto Lab</span>',

      '  <span class="sig">Hassan J Khan</span>',

    ].join('');
    homeMain.appendChild(wrap);

    if (y) y.textContent = new Date().getFullYear();

  bottomNav.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-tab');
    if (!btn) return;
    renderHome(btn.dataset.tab);
  });
  searchInput.addEventListener('input', function () {
    if (state.tab !== 'home') renderHome('home');
    else renderAllModules();
  });

  /* ─── Theme ─── */
  function applyShellTheme() {
    var isLight = state.theme === 'light';
    document.documentElement.classList.toggle('light-theme', isLight);
    document.body.classList.toggle('light-theme', isLight);
    try { document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#e8ecf3' : '#0a0d13'); } catch (_) {}
    if (pillIconMoon) pillIconMoon.style.display = isLight ? 'none' : 'block';
    if (pillIconSun)  pillIconSun.style.display  = isLight ? 'block' : 'none';
    pillTheme.classList.toggle('active', isLight);
  }
  function setTheme(t) {
    state.theme = (t === 'light') ? 'light' : 'dark';
    applyShellTheme();
    savePrefs();
    if (state.active) postTo(state.active, { type: 'command', action: 'setTheme', value: state.theme });
  }
  function setWireframe(v) {
    v = !!v;
    if (v === state.wireframe) return;
    state.wireframe = v;
    if (v) state.xray = false;
    savePrefs();
    pillWire.classList.toggle('active', state.wireframe);
    pillXRay.classList.toggle('active', state.xray);
    if (state.active) {
      postTo(state.active, { type: 'command', action: 'setWireframe', value: state.wireframe });
      postTo(state.active, { type: 'command', action: 'setXRay',      value: state.xray });
    }
  }
  function setXRay(v) {
    v = !!v;
    if (v === state.xray) return;
    state.xray = v;
    if (v) state.wireframe = false;
    savePrefs();
    pillWire.classList.toggle('active', state.wireframe);
    pillXRay.classList.toggle('active', state.xray);
    if (state.active) {
      postTo(state.active, { type: 'command', action: 'setWireframe', value: state.wireframe });
      postTo(state.active, { type: 'command', action: 'setXRay',      value: state.xray });
    }
  }

  /* ─── Open / close module ─── */
  function openModule(id) {
    var mod = modules.find(function (m) { return m.id === id; });
    if (!mod) return;
    state.active = id;
    pushRecent(id);
    for (var k in iframes) {
      if (k !== id) postTo(k, { type: 'command', action: 'setPlaying', value: false });
    }
    ensureIframe(mod);
    for (var k2 in iframes) iframes[k2].classList.toggle('active', k2 === id);
    moduleScreen.classList.add('active');
    moduleScreen.setAttribute('aria-hidden', 'false');
    homeScreen.classList.add('behind');
    document.title = mod.title + ' — Auto Lab';
    try { if (location.hash.slice(1) !== id) history.pushState(null, '', '#' + id); } catch (_) {}
    sendAllCommands(id);
    updatePlayIcon();
    var fr = iframes[id];
    if (fr && fr.contentWindow) {
      setTimeout(function () {
        try { fr.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {}
        try { if (fr.contentWindow.document) fr.contentWindow.document.dispatchEvent(new Event('resize')); } catch (_) {}
      }, 60);
    }
    closeSheet();
  }

  function closeModule() {
    if (!state.active) return;
    var id = state.active;
    postTo(id, { type: 'command', action: 'setPlaying', value: false });
    if (iframes[id]) iframes[id].classList.remove('active');
    moduleScreen.classList.remove('active');
    moduleScreen.setAttribute('aria-hidden', 'true');
    homeScreen.classList.remove('behind');
    state.active = null;
    document.title = 'Auto Lab';
    try { history.replaceState(null, '', ' '); } catch (_) {}
    closeSheet();
  }

  btnBack.addEventListener('click', function () {
    if (history.state !== null) history.back();
    else closeModule();
  });
  window.addEventListener('popstate', function () {
    var id = location.hash.slice(1);
    if (id && modules.some(function (m) { return m.id === id; })) {
      if (state.active !== id) openModule(id);
    } else closeModule();
  });

  /* ─── Pill ─── */
  function updatePlayIcon() {
    pillIconPlay.style.display  = state.playing ? 'none' : 'block';
    pillIconPause.style.display = state.playing ? 'block' : 'none';
    pillPlay.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
  }
  function setPlaying(v) {
    state.playing = v;
    updatePlayIcon();
    if (state.active) postTo(state.active, { type: 'command', action: 'setPlaying', value: v });
  }
  pillPlay.addEventListener('click', function () { setPlaying(!state.playing); });
  pillReset.addEventListener('click', function () {
    if (state.active) postTo(state.active, { type: 'command', action: 'reset' });
  });
  pillSpeed.addEventListener('input', function () {
    state.speed = parseFloat(pillSpeed.value);
    if (state.active) postTo(state.active, { type: 'command', action: 'setSpeed', value: state.speed });
    var el = document.getElementById('sheet-speed-val');
    if (el) el.textContent = formatSpeed(state.speed);
  });
  function formatSpeed(v) { return Math.round(400 + v * 900) + ' rpm'; }
  pillTheme.addEventListener('click', function () { setTheme(state.theme === 'light' ? 'dark' : 'light'); });
  pillWire.addEventListener('click', function () { setWireframe(!state.wireframe); });
  pillXRay.addEventListener('click', function () { setXRay(!state.xray); });

  /* ─── Sheet ─── */
  function openSheet() { buildSheet(); bottomSheet.classList.add('open'); sheetBackdrop.classList.add('open'); }
  function closeSheet() { bottomSheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); }
  pillMore.addEventListener('click', openSheet);
  btnMore.addEventListener('click', openSheet);
  sheetBackdrop.addEventListener('click', closeSheet);

  (function () {
    var startY = 0, curY = 0, dragging = false;
    bottomSheet.addEventListener('touchstart', function (e) {
      if (bottomSheet.scrollTop > 0) return;
      startY = e.touches[0].clientY;
      dragging = true;
      bottomSheet.style.transition = 'none';
    }, { passive: true });
    bottomSheet.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      curY = e.touches[0].clientY;
      var dy = Math.max(0, curY - startY);
      bottomSheet.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    bottomSheet.addEventListener('touchend', function () {
      if (!dragging) return;
      dragging = false;
      bottomSheet.style.transition = '';
      bottomSheet.style.transform = '';
      if (curY - startY > 100) closeSheet();
      startY = curY = 0;
    });
  })();

  function buildSheet() {
    var mod = modules.find(function (m) { return m.id === state.active; });
    if (!mod) return;
    var c = mod.color || 'var(--accent)';
    sheetContent.innerHTML = [
      '<div class="sheet-title">' + mod.title + '</div>',
      '<div class="sheet-sub">' + (mod.subtitle || '') + '</div>',
      '<div class="sheet-section">',
      '  <div class="sheet-label">Speed</div>',
      '  <div class="speed-row">',
      '    <div class="sp-icon" style="background:color-mix(in oklch, ' + c + ' 18%, transparent);color:' + c + '"><svg><use href="#i-gauge"/></svg></div>',
      '    <div class="sp-copy">',
      '      <div class="sp-name">Animation</div>',
      '      <div class="sp-val" id="sheet-speed-val">' + formatSpeed(state.speed) + '</div>',
      '    </div>',
      '    <input type="range" id="sheet-speed" min="0.15" max="2.5" step="0.05" value="' + state.speed + '" aria-label="Speed">',
      '  </div>',
      '</div>',
      '<div class="sheet-section">',
      '  <div class="sheet-label">Display</div>',
      '  <div class="toggle-row ' + (state.labels ? 'on' : '') + '" id="toggle-labels"><div class="tg-copy"><div class="tg-name">Labels</div><div class="tg-desc">Show 3D part labels</div></div><div class="switch"></div></div>',
      '  <div class="toggle-row ' + (state.gas ? 'on' : '') + '" id="toggle-gas"><div class="tg-copy"><div class="tg-name">Flow</div><div class="tg-desc">Show particle animations</div></div><div class="switch"></div></div>',
      '</div>',
      '<div class="sheet-section">',
      '  <div class="sheet-label">View</div>',
      '  <div class="toggle-row ' + (state.theme === 'light' ? 'on' : '') + '" id="toggle-theme"><div class="tg-copy"><div class="tg-name">Light theme</div><div class="tg-desc">Bright background, easier in daylight</div></div><div class="switch"></div></div>',
      '  <div class="toggle-row ' + (state.wireframe ? 'on' : '') + '" id="toggle-wire"><div class="tg-copy"><div class="tg-name">Wireframe</div><div class="tg-desc">Color-coded edges</div></div><div class="switch"></div></div>',
      '  <div class="toggle-row ' + (state.xray ? 'on' : '') + '" id="toggle-xray"><div class="tg-copy"><div class="tg-name">X-Ray</div><div class="tg-desc">Semi-transparent view</div></div><div class="switch"></div></div>',
      '</div>',
      '<div class="sheet-section" id="extras-section" style="display:none">',
      '  <div class="sheet-label">Options</div>',
      '  <div class="extras-grid" id="extras-grid"></div>',
      '</div>',
      '<button class="sheet-reset" id="sheet-reset"><svg><use href="#i-reset"/></svg>Reset module</button>'
    ].join('');

    var speedEl = sheetContent.querySelector('#sheet-speed');
    speedEl.addEventListener('input', function () {
      state.speed = parseFloat(speedEl.value);
      pillSpeed.value = state.speed;
      if (state.active) postTo(state.active, { type: 'command', action: 'setSpeed', value: state.speed });
      document.getElementById('sheet-speed-val').textContent = formatSpeed(state.speed);
    });
    sheetContent.querySelector('#toggle-labels').addEventListener('click', function (e) {
      state.labels = !state.labels;
      e.currentTarget.classList.toggle('on', state.labels);
      if (state.active) postTo(state.active, { type: 'command', action: 'setLabels', value: state.labels });
    });
    sheetContent.querySelector('#toggle-gas').addEventListener('click', function (e) {
      state.gas = !state.gas;
      e.currentTarget.classList.toggle('on', state.gas);
      if (state.active) postTo(state.active, { type: 'command', action: 'setGas', value: state.gas });
    });
    sheetContent.querySelector('#toggle-theme').addEventListener('click', function (e) {
      var next = state.theme === 'light' ? 'dark' : 'light';
      setTheme(next);
      e.currentTarget.classList.toggle('on', next === 'light');
    });
    sheetContent.querySelector('#toggle-wire').addEventListener('click', function (e) {
      setWireframe(!state.wireframe);
      e.currentTarget.classList.toggle('on', state.wireframe);
      sheetContent.querySelector('#toggle-xray').classList.toggle('on', state.xray);
    });
    sheetContent.querySelector('#toggle-xray').addEventListener('click', function (e) {
      setXRay(!state.xray);
      e.currentTarget.classList.toggle('on', state.xray);
      sheetContent.querySelector('#toggle-wire').classList.toggle('on', state.wireframe);
    });
    sheetContent.querySelector('#sheet-reset').addEventListener('click', function () {
      if (state.active) postTo(state.active, { type: 'command', action: 'reset' });
      closeSheet();
    });
    buildSheetExtras(mod);
  }

  function buildSheetExtras(mod) {
    var section = document.getElementById('extras-section');
    var grid = document.getElementById('extras-grid');
    if (!section || !grid) return;
    var id = mod.id;
    var hasExtras = false;

    if (id === 'engine') {
      hasExtras = true;
      [
        { label: 'Intake',      v: 0, c: '#38bdf8' },
        { label: 'Compression', v: 1, c: '#818cf8' },
        { label: 'Power',       v: 2, c: '#f97316' },
        { label: 'Exhaust',     v: 3, c: '#94a3b8' }
      ].forEach(function (s) {
        var b = document.createElement('button');
        b.className = 'extra-btn';
        b.style.setProperty('--c', s.c);
        b.innerHTML = '<span class="eb-num">' + (s.v + 1) + '</span>' + s.label;
        b.addEventListener('click', function () {
          grid.querySelectorAll('.extra-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          postTo('engine', { type: 'command', action: 'setStroke', value: s.v });
          closeSheet();
        });
        grid.appendChild(b);
      });
    } else if (id === 'gearbox') {
      hasExtras = true;
      [
        { label: 'Neutral', v: 0, c: '#94a3b8' },
        { label: '1st',     v: 1, c: '#22c55e' },
        { label: '2nd',     v: 2, c: '#22c55e' },
        { label: '3rd',     v: 3, c: '#22c55e' },
        { label: '4th',     v: 4, c: '#22c55e' },
        { label: 'Reverse', v: 5, c: '#ef4444' }
      ].forEach(function (g) {
        var b = document.createElement('button');
        b.className = 'extra-btn' + (g.v === 0 ? ' active' : '');
        b.style.setProperty('--c', g.c);
        var numLabel = g.label === 'Neutral' ? 'N' : g.label === 'Reverse' ? 'R' : g.v;
        b.innerHTML = '<span class="eb-num">' + numLabel + '</span>' + g.label;
        b.addEventListener('click', function () {
          grid.querySelectorAll('.extra-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          postTo('gearbox', { type: 'command', action: 'setGear', value: g.v });
          closeSheet();
        });
        grid.appendChild(b);
      });
    } else if (id === 'clutch') {
      hasExtras = true;
      var b = document.createElement('button');
      b.className = 'extra-btn';
      b.style.setProperty('--c', '#ef4444');
      b.innerHTML = '<span class="eb-num">⇩</span>Hold pedal';
      var down = function (e) {
        e.preventDefault();
        b.classList.add('active');
        if (b.setPointerCapture && e.pointerId != null) {
          try { b.setPointerCapture(e.pointerId); } catch (_) {}
        }
        postTo('clutch', { type: 'command', action: 'setPedal', value: 1 });
      };
      var up = function () {
        b.classList.remove('active');
        postTo('clutch', { type: 'command', action: 'setPedal', value: 0 });
      };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      grid.appendChild(b);
    }
    section.style.display = hasExtras ? '' : 'none';
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'auto-module') return;
    if (d.type === 'ready') {
      var fr = iframes[d.moduleId];
      if (fr) injectEmbedFix(fr);
      sendAllCommands(d.moduleId);
    }
  });

  window.addEventListener('keydown', function (e) {
    var ae = document.activeElement;
    var inShell = !ae || ae === document.body || ae.tagName === 'BODY';
    if (!inShell) return;
    if (e.key === 'Escape') {
      if (bottomSheet.classList.contains('open')) { closeSheet(); return; }
      if (state.active) closeModule();
      return;
    }
    if (!state.active) return;
    if (e.key === ' ' || e.code === 'Space') {
      if (ae && ae.tagName === 'BUTTON') return;
      e.preventDefault(); setPlaying(!state.playing);
    } else if (e.key === 'r' || e.key === 'R') { postTo(state.active, { type: 'command', action: 'reset' }); }
    else if (e.key === 'l' || e.key === 'L') { setTheme(state.theme === 'light' ? 'dark' : 'light'); }
    else if (e.key === 'w' || e.key === 'W') { setWireframe(!state.wireframe); }
    else if (e.key === 'x' || e.key === 'X') { setXRay(!state.xray); }
  });

  /* ─── PWA ─── */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e; installBtnEl.hidden = false;
  });
  installBtnEl.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null;
      installBtnEl.hidden = true;
    });
  });
  window.addEventListener('appinstalled', function () {
    installBtnEl.hidden = true; deferredPrompt = null;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function (err) {
        console.warn('[Auto Lab] SW registration failed:', err);
      });
    });
  }

  /* ─── Boot ─── */
  moduleCountEl.textContent = modules.length + ' interactive modules';
  applyShellTheme();
  pillWire.classList.toggle('active', state.wireframe);
  pillXRay.classList.toggle('active', state.xray);
  updatePlayIcon();
  renderHome('home');

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      bootLoader.classList.add('hidden');
      setTimeout(function () { try { bootLoader.remove(); } catch (_) {} }, 400);
      scheduleIdlePrefetch();
    });
  });

  var initialHash = location.hash.slice(1);
  var initialMod = modules.find(function (m) { return m.id === initialHash; });
  if (initialMod) setTimeout(function () { openModule(initialMod.id); }, 60);

  function scheduleIdlePrefetch() {
    var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1200); };
    var i = 0;
    function step() {
      if (i >= modules.length) return;
      var mod = modules[i++];
      if (iframes[mod.id]) { step(); return; }
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = mod.file;
      link.as = 'document';
      document.head.appendChild(link);
      idle(step, { timeout: 2000 });
    }
    idle(step, { timeout: 2000 });
  }
})();
</script>
</body>
</html>
