<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coil-on-Plug Ignition — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<style>
:root { --al-accent: #f97316; }
html.light-theme { --al-accent: color-mix(in oklch, #f97316 68%, black); }
#panel-readout .al-read{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font:500 11px/1.45 var(--font-mono);}
.al-read .k{color:var(--text-dim);}
.al-read .v{color:var(--text);text-align:right;font-weight:700;}
.al-read .v.hi{color:var(--al-accent);}
.al-read .v.ok{color:var(--ok);}
.al-read .v.warn{color:var(--warn);}
.al-read .v.crit{color:var(--crit);}
.al-tabs{margin-top:10px;}
.al-sec{margin-top:12px;}
.al-sec:first-child{margin-top:2px;}
.al-sec h4{margin:0 0 6px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-mute);font-weight:700;}
.al-sec p{margin:0 0 8px;font-size:12px;line-height:1.5;color:var(--text-dim);}
.al-sec ul{margin:0 0 8px;padding-left:16px;font-size:12px;line-height:1.55;color:var(--text-dim);}
.al-sec li{margin-bottom:3px;}
.al-sec b{color:var(--text);}
.al-fault{border:1px solid var(--border);border-radius:var(--r-xs,6px);padding:8px 10px;margin-bottom:6px;background:var(--surface-2);}
.al-fault .t{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.al-fault .s{font-size:11px;line-height:1.45;color:var(--text-dim);}
.al-fault .c{font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}
.al-q{margin-bottom:12px;}
.al-q .q{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4;}
.al-opt{display:block;width:100%;text-align:left;min-height:40px;padding:8px 10px;margin-bottom:4px;border:1px solid var(--border);border-radius:var(--r-xs,6px);background:var(--surface-2);color:var(--text-dim);font:inherit;font-size:12px;cursor:pointer;}
.al-opt:hover{border-color:var(--border-hi);}
.al-opt:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}
.al-opt.ok{border-color:var(--ok);color:var(--ok);}
.al-opt.no{border-color:var(--crit);color:var(--crit);}
.al-exp{display:none;font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}
.al-q.done .al-exp{display:block;}
.al-w{display:flex;flex-direction:column;gap:6px;min-width:170px;}
.al-w label{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute);}
.al-w b{color:var(--text);font-family:var(--font-mono);}
.al-range{width:100%;height:28px;background:transparent;accent-color:var(--al-accent);cursor:pointer;}
.al-range:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}
.al-legend{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text-dim);}
.al-legend span{display:flex;align-items:center;gap:7px;}
.al-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {"moduleId": "coilplug", "title": "Coil-on-Plug Ignition", "kicker": "Ignition", "accent": "#f97316", "badge": "One coil per cylinder", "camPos": [3.4, 3.2, 7.4], "target": [0, 0.2, 0], "floorY": -1.6, "ctl": {"label": "Engine speed", "val": 30, "caption": "RPM"}, "chipLabel": "Engine speed", "rows": [["dwell", "Dwell"], ["sps", "Sparks / s"]], "ro": [["rpm", "Engine speed"], ["dwell", "Dwell time"], ["sps", "Sparks per second"], ["cyl", "Firing cylinder"], ["order", "Firing order"]], "legend": [["#fb923c", "Coil charging"], ["#a5f3fc", "Spark"], ["#94a3b8", "Wiring to ECU"]], "overview": "<div class=\"al-sec\"><h4>No plug leads<\/h4><p>Each spark plug has its own coil sitting directly on top. This removes the distributor and HT leads, cutting energy loss and giving the ECU exact control of each spark.<\/p><\/div><div class=\"al-sec\"><h4>Dwell<\/h4><p>The ECU switches the coil primary on for a “dwell” time to build magnetic energy, then switches it off – the collapsing field induces 20–40 kV in the secondary.<\/p><\/div><div class=\"al-sec\"><h4>Firing order<\/h4><p>For an inline-4 the common firing order is 1-3-4-2, so power strokes are evenly spread every 180° of crank rotation.<\/p><\/div>", "faults": [["Failed coil", "Single-cylinder misfire, flashing check-engine light, P030x codes.", "Swap the coil with another cylinder; if the misfire follows, the coil is bad."], ["Cracked boot", "Spark tracking, misfire in the rain.", "Inspect the rubber boot for carbon tracks; look for oil in the plug well."], ["Low dwell voltage", "Weak spark at high rpm.", "Check battery voltage, coil supply fuse and ground."]], "quiz": [["What is dwell?", ["Time the coil is charging", "Spark plug gap", "Fuel injection time"], 0, "Dwell is the primary-current-on time during which the coil stores energy."], ["Firing order of a typical inline-4:", ["1-2-3-4", "1-3-4-2", "4-3-2-1"], 1, "1-3-4-2 spaces the power strokes evenly."], ["Advantage of coil-on-plug:", ["Needs distributor", "No HT leads, precise control", "Cheaper coils"], 1, "Fewer losses and independent control of each cylinder."]]};

const state = Base.createUIState();
const built = Base.buildScene({ fov: 42, camPos: CFG.camPos, target: CFG.target, floorY: CFG.floorY, fogDensity: 0.03 });
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;
const root = new THREE.Group();
scene.add(root);
const ptex = Base.createParticleTexture();

/* ── Tiny geometry kit ───────────────────────────────────────────── */
const mat   = (c, m = 0.6, r = 0.4, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: m, roughness: r }, o));
const glass = (c, op = 0.22) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.1, roughness: 0.2, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
const glow  = (c, i = 1.2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, metalness: 0, roughness: 0.5 });
const V3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const lc = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), clamp(t));
function put(o, x, y, z, p) { o.position.set(x || 0, y || 0, z || 0); o.castShadow = !lowEnd; (p || root).add(o); return o; }
const box  = (w, h, d, m, x, y, z, p) => put(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), x, y, z, p);
const cyl  = (rt, rb, h, m, x, y, z, p, seg = 32, open = false) => put(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), m), x, y, z, p);
const cylX = (rt, rb, h, m, x, y, z, p, seg, open) => { const o = cyl(rt, rb, h, m, x, y, z, p, seg, open); o.rotation.z = Math.PI / 2; return o; };
const cylZ = (rt, rb, h, m, x, y, z, p, seg, open) => { const o = cyl(rt, rb, h, m, x, y, z, p, seg, open); o.rotation.x = Math.PI / 2; return o; };
const sph  = (r, m, x, y, z, p) => put(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m), x, y, z, p);
const tor  = (R, r, m, x, y, z, p) => put(new THREE.Mesh(new THREE.TorusGeometry(R, r, 12, 44), m), x, y, z, p);
function pipe(pts, r, m, p) {
  const c = new THREE.CatmullRomCurve3(pts.map(V3));
  const me = new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(8, pts.length * 10), r, 10, false), m);
  (p || root).add(me); return me;
}
function stream(pts, n, color, size, closed) {
  const curve = new THREE.CatmullRomCurve3(pts.map(V3), !!closed);
  const pos = new Float32Array(n * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color, size: size || 0.1, map: ptex, transparent: true, depthWrite: false, opacity: 0.9, blending: THREE.AdditiveBlending });
  const P = new THREE.Points(g, m);
  P.frustumCulled = false; root.add(P);
  const v = new THREE.Vector3();
  return {
    points: P, mat: m,
    update(time, speed, density) {
      const cnt = Math.round(n * clamp(density == null ? 1 : density));
      for (let i = 0; i < n; i++) {
        if (i >= cnt) { pos[i * 3] = pos[i * 3 + 1] = pos[i * 3 + 2] = 1e4; continue; }
        let u = ((i / n) + time * speed) % 1; if (u < 0) u += 1;
        curve.getPointAt(u, v);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
      }
      g.attributes.position.needsUpdate = true;
    }
  };
}
const H = { THREE, root, lowEnd, mat, glass, glow, V3, clamp, lerp, lc, put, box, cyl, cylX, cylZ, sph, tor, pipe, stream, Base };

/* ── MODULE SCENE (per-module code) ──────────────────────────────── */

function build(H){
 const {box,cyl,sph,mat,glass,pipe,lc,clamp,THREE}=H;
 box(5.4,.7,1.7,glass(0x94a3b8,.28),0,-1.05,0); box(5.4,.1,1.7,mat(0x3d4555,.5,.5),0,-1.45,0);
 const xs=[-1.95,-.65,.65,1.95], coils=[], sparks=[];
 xs.forEach((x,i)=>{
   const m=new THREE.MeshStandardMaterial({color:0x111827,metalness:.3,roughness:.5,emissive:0xfb923c,emissiveIntensity:0});
   cyl(.25,.25,1.5,m,x,.2,0); box(.34,.32,.34,mat(0x1f2937,.3,.6),x,1.1,0);
   cyl(.16,.21,.55,mat(0xb91c1c,.1,.7),x,-.5,0); cyl(.08,.08,.5,mat(0xcbd5e1,.8,.3),x,-.95,0);
   const sm=new THREE.MeshBasicMaterial({color:0xa5f3fc,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
   sparks.push(sph(.22,sm,x,-1.25,0)); coils.push(m);
 });
 box(1.8,.5,1.0,mat(0x1e293b,.4,.5),0,2.0,-1.1);
 xs.forEach(x=>pipe([[x*.3,2.0,-1.1],[x*.6,1.7,-.7],[x,1.35,-.15],[x,1.2,0]],.035,mat(0x94a3b8,.3,.6)));
 const order=[0,2,3,1];
 return {
  labels:[['ECU',[0,2.45,-1.1]],['Ignition coil',[-1.95,1.25,0]],['Rubber boot',[-.65,-.5,.3]],['Spark plug',[.65,-1.0,.5]],['Cylinder head',[1.95,-1.5,.9]]],
  update(c){
   const rpm=800+5700*c.k, dwell=4.0-2.2*c.k, interval=30000/rpm, frac=clamp(dwell/interval,0,.95);
   const p=(c.t*rpm/3000)%1, slot=Math.floor(p*4), u=p*4-slot, cur=order[slot], nxt=order[(slot+1)%4];
   for(let i=0;i<4;i++){
     let e=0, s=0;
     if(i===nxt&&u>1-frac) e=(u-(1-frac))/frac;
     if(i===cur&&u<.2){ e=.0; s=1-u/.2; }
     coils[i].emissiveIntensity=e*1.6; sparks[i].material.opacity=s*.85;
   }
   return {big:rpm.toFixed(0),unit:' rpm',bar:c.k*100,rows:{dwell:dwell.toFixed(1)+' ms',sps:(rpm/30).toFixed(0)},
    ro:{rpm:[rpm.toFixed(0),'hi'],dwell:[dwell.toFixed(1)+' ms',''],sps:[(rpm/30).toFixed(0)+' /s',''],cyl:['#'+(cur+1),'ok'],order:['1-3-4-2','']},
    status:['Firing #'+(cur+1),true],ctl:rpm.toFixed(0)+' rpm'};
  }};
}
const mod = build(H);

/* ── Labels ──────────────────────────────────────────────────────── */
const labels = Base.createLabelSystem();
mod.labels.forEach((l, i) => labels.add('l' + i, l[0]));
const lpos = mod.labels.map(l => V3(l[1]));

/* ── UI ──────────────────────────────────────────────────────────── */
const TABS = {
  overview: () => CFG.overview,
  faults: () => '<div class="al-sec"><h4>Common faults</h4></div>' + CFG.faults.map(f =>
    `<div class="al-fault"><div class="t">${f[0]}</div><div class="s">${f[1]}</div><div class="c">Check: ${f[2]}</div></div>`).join(''),
  quiz: () => CFG.quiz.map((q, n) => `<div class="al-q" data-a="${q[2]}"><div class="q">${n + 1}. ${q[0]}</div>` +
    q[1].map(o => `<button class="al-opt">${o}</button>`).join('') + `<div class="al-exp">${q[3]}</div></div>`).join('')
};
const readoutHTML = () => '<div class="al-read">' + CFG.ro.map(r =>
  `<span class="k">${r[1]}</span><span class="v${r[2] ? ' ' + r[2] : ''}" id="ro-${r[0]}"></span>`).join('') + '</div>';

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: CFG.kicker, title: CFG.title,
    tabs: [{ id: 'overview', label: 'Overview' }, { id: 'faults', label: 'Faults' }, { id: 'quiz', label: 'Self-check' }],
    onTab: renderTab,
    badge: { text: CFG.badge, color: CFG.accent },
    readout: readoutHTML()
  },
  chip: { label: CFG.chipLabel, value: '', unit: '', bar: true, rows: CFG.rows.map(r => ({ id: r[0], label: r[1], value: '' })), status: { text: 'Running' } },
  toolbar: { play: true, reset: true, speed: { label: 'Sim speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 }, labels: true },
  widgets: {
    bl: {
      html: `<div class="al-w"><label for="ctl">${CFG.ctl.label} <b id="ctl-out"></b></label>
        <input id="ctl" class="al-range" type="range" min="0" max="100" step="1" value="${CFG.ctl.val}" aria-label="${CFG.ctl.label}"></div>`,
      caption: CFG.ctl.caption || 'Control'
    },
    br: { html: '<div class="al-legend">' + CFG.legend.map(l => `<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join('') + '</div>', caption: 'Legend' }
  }
});
const tabHost = document.createElement('div');
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);
tabHost.addEventListener('click', (e) => {
  const btn = e.target.closest('.al-opt'); if (!btn) return;
  const q = btn.closest('.al-q'); if (!q || q.classList.contains('done')) return;
  const answer = Number(q.dataset.a);
  q.classList.add('done');
  q.querySelectorAll('.al-opt').forEach((o, i) => { o.disabled = true; if (i === answer) o.classList.add('ok'); else if (o === btn) o.classList.add('no'); });
});
function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

const ctlEl = document.getElementById('ctl');
const ctlOut = document.getElementById('ctl-out');
const ROE = {}; CFG.ro.forEach(r => { ROE[r[0]] = document.getElementById('ro-' + r[0]); });
let k = CFG.ctl.val / 100;
ctlEl.addEventListener('input', () => { k = ctlEl.value / 100; refresh(0); });

let simT = 0;
function apply(o) {
  if (!o) return;
  if (o.big != null) ui.chip.setBig(o.big, o.unit || '');
  if (o.bar != null) ui.chip.setBar(o.bar, 'var(--al-accent)');
  if (o.rows) for (const id in o.rows) ui.chip.set(id, o.rows[id]);
  if (o.ro) for (const id in o.ro) { const el = ROE[id]; if (el) { el.textContent = o.ro[id][0]; el.className = 'v ' + (o.ro[id][1] || ''); } }
  if (o.status) ui.chip.setStatus(o.status[0], o.status[1]);
  if (o.ctl != null) ctlOut.textContent = o.ctl;
}
function refresh(dt) { apply(mod.update({ t: simT, dt, k, sp: state.playing ? state.speedMul : 0 })); }

const bridge = ui.wireBridge({
  viewManager, state,
  onCommand: (d) => {
    if (d.action === 'reset') { k = CFG.ctl.val / 100; ctlEl.value = CFG.ctl.val; simT = 0; refresh(0); }
  }
});
bridge.ready();
bridge.setStatus(CFG.title + ' ready', CFG.accent);

/* ── Animation ───────────────────────────────────────────────────── */
let last = performance.now(), raf = 0, roClock = 1;
const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sp = state.playing ? state.speedMul : 0;
  simT += dt * sp;
  const o = mod.update({ t: simT, dt: dt * sp, k, sp });
  roClock += dt;
  if (roClock > 0.12) { roClock = 0; apply(o); }
  labels.hideAll();
  if (state.showLabels) lpos.forEach((p, i) => labels.project('l' + i, p, camera, wrap));
  controls.update();
  renderer.render(scene, camera);
}
if (reduced) { setInterval(() => { refresh(0); renderer.render(scene, camera); }, 120); }
else raf = requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
});
refresh(0);
</script>
</body>
</html>
