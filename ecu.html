<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECU · Auto Lab</title>
<link rel="stylesheet" href="app.css">
<style>
:root { --al-accent: #a855f7; }
html.light-theme { --al-accent: #7c3aed; }

#panel-readout .al-read{
  display:grid;grid-template-columns:1fr auto;gap:3px 12px;
  font:500 11px/1.45 var(--font-mono);
}
.al-read .k{color:var(--text-dim);}
.al-read .v{color:var(--text);text-align:right;font-weight:700;}
.al-read .v.hi{color:var(--al-accent);}
.al-read .v.ok{color:var(--ok);}
.al-read .v.warn{color:var(--warn);}
.al-read .v.crit{color:var(--crit);}

.al-tabs{margin-top:10px;}
.al-sec{margin-top:12px;}
.al-sec:first-child{margin-top:2px;}
.al-sec h4{
  margin:0 0 6px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700;
}
.al-sec p{margin:0 0 8px;font-size:12px;line-height:1.5;color:var(--text-dim);}
.al-sec ul{margin:0 0 8px;padding-left:16px;font-size:12px;line-height:1.55;color:var(--text-dim);}
.al-sec li{margin-bottom:3px;}
.al-sec b{color:var(--text);}

.al-fault{
  border:1px solid var(--border);border-radius:var(--r-xs,6px);
  padding:8px 10px;margin-bottom:6px;background:var(--surface-2);
}
.al-fault .t{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.al-fault .s{font-size:11px;line-height:1.45;color:var(--text-dim);}
.al-fault .c{font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}

.al-q{margin-bottom:12px;}
.al-q .q{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4;}
.al-opt{
  display:block;width:100%;text-align:left;min-height:40px;padding:8px 10px;margin-bottom:4px;
  border:1px solid var(--border);border-radius:var(--r-xs,6px);background:var(--surface-2);
  color:var(--text-dim);font:inherit;font-size:12px;cursor:pointer;
}
.al-opt:hover{border-color:var(--border-hi);}
.al-opt:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}
.al-opt.ok{border-color:var(--ok);color:var(--ok);}
.al-opt.no{border-color:var(--crit);color:var(--crit);}
.al-exp{display:none;font-size:11px;line-height:1.45;color:var(--text-mute);margin-top:4px;}
.al-q.done .al-exp{display:block;}

.al-w{display:flex;flex-direction:column;gap:6px;min-width:160px;}
.al-w label{
  display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-mute);
}
.al-w b{color:var(--text);font-family:var(--font-mono);}
.al-range{
  width:100%;height:28px;background:transparent;accent-color:var(--al-accent);cursor:pointer;
}
.al-range:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px;}

.al-map-canvas{
  width:100%; height:auto; display:block;
  border-radius:var(--r-xs,6px);
  background:color-mix(in oklch, var(--bg) 60%, transparent);
  border:1px solid var(--border);
}

.ui-tb-btn.active{outline:2px solid var(--al-accent);color:var(--al-accent);}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'ecu',
  accent:   '#a855f7',
  flowHz:   0.42,
  maxRpm:   7000,
  minRpm:   800,
  wireColor:    0x556074,   // idle wire tube color
  wireDeadColor:0xb03030,   // O2 fault wire tube color
  nodeIdleColor:0x38bdf8,
  nodeDeadColor:0x8a2222
};

const state = Base.createUIState();
state.load  = 35;
state.fault = 'none';

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [6.0, 4.2, 8.0],
  target: [0, 0.55, 0],
  floorY: -1.6,
  fogDensity: 0.030
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();
const root = new THREE.Group();
scene.add(root);

const pcbMat  = new THREE.MeshStandardMaterial({ color: 0x1d6b3c, roughness: 0.78, metalness: 0.06 });
const chipMat = new THREE.MeshStandardMaterial({ color: 0x15191f, roughness: 0.50, metalness: 0.35 });
const pinMat  = new THREE.MeshStandardMaterial({ color: 0xc8c8d0, metalness: 0.85, roughness: 0.25 });
const connMat = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 0.60, metalness: 0.45 });
const capsMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.55, metalness: 0.35 });
const smdMat  = new THREE.MeshStandardMaterial({ color: 0x2a2e35, roughness: 0.45, metalness: 0.55 });

/* ═══════════════════════════════════════════════════════════════════════
   ECU ENCLOSURE
   ═══════════════════════════════════════════════════════════════════════ */
const caseMesh = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.72, 1.8), M.matMetalDark);
caseMesh.position.y = 0.36;
caseMesh.castShadow = true;
caseMesh.receiveShadow = true;
root.add(caseMesh);

const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.32, 0.06, 1.52), pcbMat);
pcb.position.y = 0.75;
pcb.castShadow = true;
root.add(pcb);

/* --- Main CPU --- */
const cpuGroup = new THREE.Group();
cpuGroup.position.set(-0.72, 0.86, -0.05);
root.add(cpuGroup);

const cpuBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.72, 0.14, 0.72),
  new THREE.MeshStandardMaterial({ color: 0x0d0f14, roughness: 0.42, metalness: 0.42 })
);
cpuBody.castShadow = true;
cpuGroup.add(cpuBody);

const cpuDie = new THREE.Mesh(
  new THREE.BoxGeometry(0.30, 0.02, 0.30),
  new THREE.MeshStandardMaterial({ color: 0x16182a, roughness: 0.35, metalness: 0.60 })
);
cpuDie.position.y = 0.08;
cpuGroup.add(cpuDie);

const cpuGlowMat = new THREE.MeshStandardMaterial({
  color: 0x000000, emissive: 0xa855f7, emissiveIntensity: 0.6,
  metalness: 0.0, roughness: 1.0
});
const cpuGlow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.012, 0.22), cpuGlowMat);
cpuGlow.position.y = 0.093;
cpuGroup.add(cpuGlow);

/* Pins around the CPU */
(function addCpuPins() {
  const perSide = lowEnd ? 5 : 8;
  const gN = new THREE.BoxGeometry(0.025, 0.03, 0.06);
  const gEW = new THREE.BoxGeometry(0.06, 0.03, 0.025);
  for (let i = 0; i < perSide; i++) {
    const frac = (i / (perSide - 1)) - 0.5;
    const x = frac * 0.72;
    const z = frac * 0.72;
    const nPin = new THREE.Mesh(gN, pinMat); nPin.position.set(x, -0.005, -0.39); cpuGroup.add(nPin);
    const sPin = new THREE.Mesh(gN, pinMat); sPin.position.set(x, -0.005,  0.39); cpuGroup.add(sPin);
    const ePin = new THREE.Mesh(gEW, pinMat); ePin.position.set( 0.39, -0.005, z); cpuGroup.add(ePin);
    const wPin = new THREE.Mesh(gEW, pinMat); wPin.position.set(-0.39, -0.005, z); cpuGroup.add(wPin);
  }
})();

/* --- Support chips --- */
[
  { x: 0.42, z: -0.34, w: 0.46, d: 0.38, h: 0.10 },
  { x: 0.42, z:  0.34, w: 0.46, d: 0.38, h: 0.10 },
  { x:-0.05, z:  0.42, w: 0.36, d: 0.24, h: 0.08 }
].forEach(c => {
  const chip = new THREE.Mesh(new THREE.BoxGeometry(c.w, c.h, c.d), chipMat);
  chip.position.set(c.x, 0.79 + c.h / 2, c.z);
  chip.castShadow = true;
  root.add(chip);
});

/* --- SMD scatter (golden-angle) --- */
(function addSmd() {
  const n = lowEnd ? 10 : 22;
  for (let i = 0; i < n; i++) {
    const angle = (i * 137.5) * Math.PI / 180;
    const r = 0.15 + (i / n) * 1.05;
    const px = Math.cos(angle) * r * 0.85;
    const pz = Math.sin(angle) * r * 0.55;
    if (Math.abs(px - (-0.72)) < 0.42 && Math.abs(pz - (-0.05)) < 0.42) continue;
    if (Math.abs(px - 0.42) < 0.30 && Math.abs(Math.abs(pz) - 0.34) < 0.26) continue;

    const isCap = i % 3 === 0;
    const geo = isCap
      ? new THREE.CylinderGeometry(0.035, 0.035, 0.08, 8)
      : new THREE.BoxGeometry(0.06, 0.03, 0.035);
    const mesh = new THREE.Mesh(geo, isCap ? capsMat : smdMat);
    mesh.position.set(px, 0.79 + (isCap ? 0.04 : 0.015), pz);
    if (i % 4 === 1) mesh.rotation.y = Math.PI / 2;
    root.add(mesh);
  }
})();

/* --- Edge connectors --- */
[-1, 1].forEach(s => {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.50, 1.30), connMat);
  c.position.set(s * 1.42, 0.36, 0);
  c.castShadow = true;
  root.add(c);
});

/* --- MIL lamp on the ECU board --- */
const milLampMat = new THREE.MeshStandardMaterial({
  color: 0x3a1010, emissive: 0x000000, emissiveIntensity: 0,
  metalness: 0.0, roughness: 1.0
});
const milLamp = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, lowEnd ? 8 : 12, lowEnd ? 6 : 8),
  milLampMat
);
milLamp.position.set(1.02, 0.82, 0.56);
root.add(milLamp);

/* ═══════════════════════════════════════════════════════════════════════
   SENSOR / ACTUATOR NODES — distinct shape per type
   ═══════════════════════════════════════════════════════════════════════ */
const NODE_Y = 0.42;
const pGeo = new THREE.SphereGeometry(0.05, lowEnd ? 6 : 10, lowEnd ? 5 : 8);

function makeNodeShape(id, mat) {
  const g = new THREE.Group();
  switch (id) {
    case 'maf': {
      const tube = new THREE.Mesh(
        new THREE.CylinderGeometry(0.20, 0.20, 0.50, 12, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0x3a4550, metalness: 0.60, roughness: 0.40, side: THREE.DoubleSide
        })
      );
      tube.rotation.z = Math.PI / 2;
      g.add(tube);
      const elem = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.18, 8), mat);
      g.add(elem);
      break;
    }
    case 'ckp': {
      const cog = Base.makeCog(0.19, 0.14, 10, 0.05, 0.07, mat, mat);
      cog.rotation.x = Math.PI / 2;
      g.add(cog);
      break;
    }
    case 'tps': {
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.14, 16), mat);
      disc.rotation.x = Math.PI / 2;
      g.add(disc);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.26), mat);
      arm.position.z = 0.16;
      g.add(arm);
      break;
    }
    case 'o2': {
      /* Removed redundant vertical wire stub — the ECU link tube handles the cable. */
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.36, 10), mat);
      g.add(body);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.10, 10, 8), mat);
      tip.position.y = -0.18;
      g.add(tip);
      break;
    }
    case 'inj': {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.24, 12), mat);
      body.position.y = 0.10;
      g.add(body);
      const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.16, 12), mat);
      nozzle.position.y = -0.10;
      nozzle.rotation.z = Math.PI;
      g.add(nozzle);
      const connector = new THREE.Mesh(
        new THREE.BoxGeometry(0.10, 0.10, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x2a3038, metalness: 0.55, roughness: 0.50 })
      );
      connector.position.y = 0.24;
      g.add(connector);
      break;
    }
    case 'ign': {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.34, 12), mat);
      g.add(body);
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.14, 8), mat);
      tower.position.y = 0.24;
      g.add(tower);
      break;
    }
    case 'thr': {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.32, 14), mat);
      body.rotation.z = Math.PI / 2;
      g.add(body);
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.16, 8),
        new THREE.MeshStandardMaterial({ color: 0xb0b8c4, metalness: 0.80, roughness: 0.25 })
      );
      shaft.rotation.z = Math.PI / 2;
      shaft.position.x = 0.22;
      g.add(shaft);
      break;
    }
    case 'egr': {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.28, 0.34), mat);
      g.add(body);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.10, 12), mat);
      cap.position.y = 0.19;
      g.add(cap);
      break;
    }
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const INPUTS = [
  { id: 'maf', text: 'MAF / MAP',     z: -1.50, color: 0x38bdf8 },
  { id: 'ckp', text: 'Crank sensor',  z: -0.50, color: 0x38bdf8 },
  { id: 'tps', text: 'Throttle pos.', z:  0.50, color: 0x38bdf8 },
  { id: 'o2',  text: 'O₂ sensor',     z:  1.50, color: 0x38bdf8 }
];
const OUTPUTS = [
  { id: 'inj', text: 'Injectors',      z: -1.50, color: 0xffb020 },
  { id: 'ign', text: 'Ignition coils', z: -0.50, color: 0xffb020 },
  { id: 'thr', text: 'Throttle motor', z:  0.50, color: 0xffb020 },
  { id: 'egr', text: 'EGR / purge',    z:  1.50, color: 0xffb020 }
];

const lines = [];

function makeLink(a, b, colour) {
  /* Per-link material so each cable can be tinted independently (fix #1). */
  const localWireMat = new THREE.MeshStandardMaterial({
    color: CFG.wireColor, roughness: 0.55, metalness: 0.35
  });
  const tube = Base.tubeBetween(a, b, 0.022, 0.022, localWireMat, true);
  tube.castShadow = false;
  root.add(tube);

  const parts = [];
  const n = lowEnd ? 3 : 5;
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: colour }));
    root.add(p);
    parts.push(p);
  }
  const rec = { a: a.clone(), b: b.clone(), parts, mat: localWireMat, tube, dead: false };
  lines.push(rec);
  return rec;
}

function placeNode(spec, side) {
  const mat = new THREE.MeshStandardMaterial({ color: spec.color, roughness: 0.42, metalness: 0.40 });
  spec.mat = mat;

  const shape = makeNodeShape(spec.id, mat);
  shape.position.set(side * 3.0, NODE_Y, spec.z);
  root.add(shape);
  spec.nodeGroup = shape;
  spec.mesh = shape;

  const halo = new THREE.Mesh(
    new THREE.RingGeometry(0.30, 0.38, lowEnd ? 14 : 24),
    new THREE.MeshBasicMaterial({
      color: spec.color, transparent: true, opacity: 0.28,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  halo.position.set(side * 3.0, 0.02, spec.z);
  halo.rotation.x = -Math.PI / 2;
  root.add(halo);
  spec.halo = halo;
  return shape;
}

INPUTS.forEach(n => {
  placeNode(n, -1);
  n.link = makeLink(
    new THREE.Vector3(-2.75, NODE_Y, n.z),
    new THREE.Vector3(-1.56, 0.36, n.z * 0.45),
    0x38bdf8
  );
});
OUTPUTS.forEach(n => {
  placeNode(n, 1);
  n.link = makeLink(
    new THREE.Vector3(1.56, 0.36, n.z * 0.45),
    new THREE.Vector3(2.75, NODE_Y, n.z),
    0xffb020
  );
});

/* ═══════════════════════════════════════════════════════════════════════
   ACTUATOR EFFECTS
   ═══════════════════════════════════════════════════════════════════════ */
/* Injector nozzle tip is at world Y = NODE_Y - 0.10 - 0.08 = 0.24. */
const INJ_NOZZLE_Y = 0.24;
const SPRAY_HALF_HEIGHT = 0.17;   /* half of ConeGeometry height (0.34) */

const sprayMat = new THREE.MeshBasicMaterial({
  color: 0xffd070, transparent: true, opacity: 0,
  side: THREE.DoubleSide, depthWrite: false
});
const sprayCone = new THREE.Mesh(
  new THREE.ConeGeometry(0.16, 0.34, 12, 1, true),
  sprayMat
);
sprayCone.rotation.z = Math.PI;
sprayCone.position.set(3.0, INJ_NOZZLE_Y - SPRAY_HALF_HEIGHT, -1.50);
root.add(sprayCone);

const sparkMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0, depthWrite: false
});
const spark = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), sparkMat);
spark.position.set(3.0, NODE_Y + 0.32, -0.50);
root.add(spark);

const egrPuffMat = new THREE.MeshBasicMaterial({
  color: 0x8090a0, transparent: true, opacity: 0, depthWrite: false
});
const egrPuff = new THREE.Mesh(new THREE.SphereGeometry(0.10, 10, 8), egrPuffMat);
egrPuff.position.set(3.0, NODE_Y + 0.32, 1.50);
root.add(egrPuff);

/* ═══════════════════════════════════════════════════════════════════════
   LABELS
   ═══════════════════════════════════════════════════════════════════════ */
const labels = Base.createLabelSystem();
labels.add('ecu', 'ECU');
labels.add('cpu', 'CPU');
INPUTS.forEach(n => labels.add('in-' + n.id, n.text));
OUTPUTS.forEach(n => labels.add('out-' + n.id, n.text));

/* ═══════════════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = {
  overview: () => `
    <div class="al-sec">
      <h4>What it does</h4>
      <p>The engine control unit is the computer that runs the engine. It reads sensors,
      compares them with <b>maps</b> held in flash memory, and drives the actuators that meter
      fuel, fire the coils and set the throttle — hundreds of times per second.</p>
    </div>
    <div class="al-sec">
      <h4>Signal chain</h4>
      <ul>
        <li><b>Inputs</b> — MAF/MAP, crank &amp; cam position, throttle, coolant, upstream O₂, knock.</li>
        <li><b>Processing</b> — 10–100 µs task scheduler; fuel and spark maps indexed by engine speed and load.</li>
        <li><b>Outputs</b> — injectors, ignition coils, electronic throttle, EGR and purge valves.</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>The fuel map</h4>
      <p>The <b>map grid</b> (bottom-right of this view) is the ECU's lookup table. Columns are
      engine speed, rows are engine load. Each cell holds the required injection quantity.
      The crosshair tracks the current operating point as the load slider moves.</p>
    </div>
    <div class="al-sec">
      <h4>Closed loop</h4>
      <p>At λ = 1 the upstream O₂ sensor swings between roughly 0.1 V and 0.9 V. The ECU moves the
      <b>short-term fuel trim</b> until those swings average out. Typical authority is ±25 %.</p>
    </div>`,
  faults: () => `
    <div class="al-sec"><h4>Common faults</h4></div>
    <div class="al-fault">
      <div class="t">Sensor open or short circuit</div>
      <div class="s">MIL on, rich running, poor economy, P0100-series code stored.</div>
      <div class="c">Check: 5 V reference at the plug, sensor resistance, continuity back to the ECU.</div>
    </div>
    <div class="al-fault">
      <div class="t">Crank sensor no signal</div>
      <div class="s">Cranks but will not start — no spark, no injection pulse.</div>
      <div class="c">Check: air gap (typical 0.5–1.5 mm), coil resistance (typical 500–1500 Ω), tach signal while cranking.</div>
    </div>
    <div class="al-fault">
      <div class="t">CAN bus fault</div>
      <div class="s">U-codes, several modules offline at once, instrument pack dead.</div>
      <div class="c">Check: 60 Ω across the bus with the ignition off, 2.5 V and 2.5 V on CAN-H / CAN-L.</div>
    </div>
    <div class="al-fault">
      <div class="t">Failed ECU (rare)</div>
      <div class="s">No communication, no injector pulse, water in the connector.</div>
      <div class="c">Check: powers, grounds and 5 V rails first — replace only after ruling out wiring.</div>
    </div>`,
  quiz: () => `
    <div class="al-q" data-a="1">
      <div class="q">1. Which sensor keeps the mixture in closed loop at cruise?</div>
      <button class="al-opt">Crankshaft position sensor</button>
      <button class="al-opt">Upstream heated oxygen sensor</button>
      <button class="al-opt">Knock sensor</button>
      <div class="al-exp">The upstream (pre-catalyst) O₂ sensor measures oxygen in the exhaust; the ECU trims fuel until it averages λ = 1.</div>
    </div>
    <div class="al-q" data-a="2">
      <div class="q">2. What is a fuel map?</div>
      <button class="al-opt">A wiring diagram for the injectors</button>
      <button class="al-opt">A list of stored fault codes</button>
      <button class="al-opt">A lookup table of injection quantity against engine speed and load</button>
      <div class="al-exp">Maps are calibrated tables indexed by speed and load; the ECU interpolates between the nearest cells.</div>
    </div>
    <div class="al-q" data-a="0">
      <div class="q">3. What happens in limp-home mode?</div>
      <button class="al-opt">The ECU substitutes default values and limits engine load</button>
      <button class="al-opt">The engine stops immediately</button>
      <button class="al-opt">The ECU resets every map to zero</button>
      <div class="al-exp">Defaults keep the car driveable; the MIL stays on until the fault is repaired and codes are cleared.</div>
    </div>`
};

function readoutHTML() {
  return `<div class="al-read">
    <span class="k">Engine speed</span><span class="v hi" id="ro-rpm">—</span>
    <span class="k">Engine load</span><span class="v" id="ro-load">—</span>
    <span class="k">Injection pulse</span><span class="v" id="ro-pw">—</span>
    <span class="k">Ignition advance</span><span class="v" id="ro-adv">—</span>
    <span class="k">Short-term trim</span><span class="v" id="ro-trim">—</span>
    <span class="k">Fuel control</span><span class="v" id="ro-loop">—</span>
    <span class="k">Malfunction lamp</span><span class="v" id="ro-mil">—</span>
  </div>`;
}

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: 'Sensors & Control',
    title:  'Engine control unit',
    tabs: [
      { id: 'overview', label: 'Overview' },
      { id: 'faults',   label: 'Faults' },
      { id: 'quiz',     label: 'Self-check' }
    ],
    onTab: renderTab,
    badge: { text: 'Closed loop', color: CFG.accent },
    readout: readoutHTML()
  },
  chip: {
    label: 'Engine',
    value: '—',
    unit: ' rpm',
    bar: true,
    rows: [
      { id: 'load', label: 'Load',    value: '—' },
      { id: 'adv',  label: 'Advance', value: '—' }
    ],
    status: { text: 'Running' }
  },
  toolbar: {
    play: true,
    reset: true,
    speed: { label: 'Sim speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
    labels: true,
    extras: [
      { id: 'btn-fault', label: 'O₂ FAULT', title: 'Toggle upstream oxygen sensor fault', onClick: toggleFault }
    ]
  },
  widgets: {
    bl: {
      html: `<div class="al-w">
        <label for="load-range">Engine load <b id="load-out">35%</b></label>
        <input id="load-range" class="al-range" type="range" min="0" max="100" step="1"
               value="35" aria-label="Engine load percentage">
      </div>`,
      caption: 'Operating point',
      onMount: mountLoadWidget
    },
    br: {
      html: `<canvas id="map-canvas" class="al-map-canvas" width="280" height="150"
               aria-label="Fuel map lookup table"></canvas>`,
      caption: 'Fuel map · rpm × load',
      onMount: mountMapWidget
    }
  }
});

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);

tabHost.addEventListener('click', (e) => {
  const btn = e.target.closest('.al-opt');
  if (!btn) return;
  const q = btn.closest('.al-q');
  if (!q || q.classList.contains('done')) return;
  const answer = Number(q.dataset.a);
  q.classList.add('done');
  q.querySelectorAll('.al-opt').forEach((o, i) => {
    o.disabled = true;
    if (i === answer) o.classList.add('ok');
    else if (o === btn) o.classList.add('no');
  });
});

function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

function mountLoadWidget(el) {
  const inp = el.querySelector('#load-range');
  const out = el.querySelector('#load-out');
  if (!inp || !out) return;
  inp.value = state.load;
  out.textContent = state.load + '%';
  inp.addEventListener('input', () => {
    state.load = Number(inp.value);
    out.textContent = state.load + '%';
    updateReadouts();
  });
}

/* ─── Map canvas setup ─── */
let mapCanvas = null;
let mapCtx = null;
let mapW = 0, mapH = 0;
function mountMapWidget(el) {
  mapCanvas = el.querySelector('#map-canvas');
  if (!mapCanvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = mapCanvas.width;
  const cssH = mapCanvas.height;
  mapCanvas.style.width  = '100%';
  mapCanvas.style.height = 'auto';
  mapCanvas.width  = cssW * dpr;
  mapCanvas.height = cssH * dpr;
  mapCtx = mapCanvas.getContext('2d');
  mapCtx.scale(dpr, dpr);
  mapW = cssW;
  mapH = cssH;
}

function toggleFault() {
  state.fault = state.fault === 'o2' ? 'none' : 'o2';
  const b = document.getElementById('btn-fault');
  if (b) b.classList.toggle('active', state.fault !== 'none');
  applyFaultVisuals();
  updateReadouts();
}

/* ═══════════════════════════════════════════════════════════════════════
   FAULT VISUALS — fix #1: also tint the O2 wire tube
   ═══════════════════════════════════════════════════════════════════════ */
function applyFaultVisuals() {
  const dead = state.fault === 'o2';
  const o2 = INPUTS.find(n => n.id === 'o2');
  if (o2) {
    o2.link.dead = dead;
    /* Node body + tip */
    o2.mat.color.setHex(dead ? CFG.nodeDeadColor : CFG.nodeIdleColor);
    /* Halo ring */
    o2.halo.material.color.setHex(dead ? CFG.nodeDeadColor : CFG.nodeIdleColor);
    o2.halo.material.opacity = dead ? 0.15 : 0.28;
    /* Wire tube — now that each link owns its material, tint safely */
    if (o2.link.mat) {
      o2.link.mat.color.setHex(dead ? CFG.wireDeadColor : CFG.wireColor);
    }
  }

  /* MIL lamp on the ECU */
  if (dead) {
    milLampMat.color.setHex(0xff2020);
    milLampMat.emissive.setHex(0xff2020);
    milLampMat.emissiveIntensity = 1.4;
  } else {
    milLampMat.color.setHex(0x3a1010);
    milLampMat.emissive.setHex(0x000000);
    milLampMat.emissiveIntensity = 0;
  }

  /* Badge */
  const badge = document.getElementById('stroke-badge');
  const text  = document.getElementById('badge-text');
  const col   = dead ? '#ef4444' : CFG.accent;
  if (badge) {
    badge.style.background = `color-mix(in oklch, ${col} 18%, transparent)`;
    badge.style.color = col;
  }
  if (text) text.textContent = dead ? 'Open loop · default' : 'Closed loop';
}
applyFaultVisuals();

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
const ro = {
  rpm:  document.getElementById('ro-rpm'),
  load: document.getElementById('ro-load'),
  pw:   document.getElementById('ro-pw'),
  adv:  document.getElementById('ro-adv'),
  trim: document.getElementById('ro-trim'),
  loop: document.getElementById('ro-loop'),
  mil:  document.getElementById('ro-mil')
};

function currentRpm() {
  const load = state.load / 100;
  return Math.round(CFG.minRpm + load * (CFG.maxRpm - CFG.minRpm));
}

function updateReadouts() {
  const load = state.load / 100;
  const dead = state.fault === 'o2';

  const rpm  = currentRpm();
  const pw   = 1.6 + load * 11.5;
  const adv  = 28 - load * 20 - (dead ? 4 : 0);
  const stft = dead ? 0 : Math.sin(performance.now() * 0.0011) * 3.2;

  if (ro.rpm)  ro.rpm.textContent  = rpm + ' rpm';
  if (ro.load) ro.load.textContent = state.load + ' %';
  if (ro.pw)   ro.pw.textContent   = pw.toFixed(2) + ' ms';
  if (ro.adv)  ro.adv.textContent  = adv.toFixed(1) + '° BTDC';
  if (ro.trim) {
    ro.trim.textContent = (stft >= 0 ? '+' : '') + stft.toFixed(1) + ' %';
    ro.trim.className = 'v ' + (dead ? 'crit' : 'ok');
  }
  if (ro.loop) {
    ro.loop.textContent = dead ? 'Open loop (default)' : 'Closed loop';
    ro.loop.className = 'v ' + (dead ? 'crit' : 'ok');
  }
  if (ro.mil) {
    ro.mil.textContent = dead ? 'ON' : 'OFF';
    /* fix #3: no trailing space */
    ro.mil.className = dead ? 'v warn' : 'v';
  }

  ui.chip.setBig(rpm, ' rpm');
  ui.chip.set('load', state.load + ' %');
  ui.chip.set('adv', adv.toFixed(1) + '°');
  ui.chip.setBar(state.load, dead ? 'var(--crit)' : 'var(--al-accent)');
  ui.chip.setStatus(dead ? 'Limp home' : 'Running', !dead);

  drawFuelMap(rpm, state.load, dead);
}

/* ═══════════════════════════════════════════════════════════════════════
   FUEL MAP VISUALIZATION
   ═══════════════════════════════════════════════════════════════════════ */
function lerpRGB(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

function mapValue(speedN, loadN) {
  return Math.min(1, loadN * 1.05 + speedN * 0.10);
}

function drawFuelMap(rpm, loadPct, dead) {
  if (!mapCtx) return;
  const ctx = mapCtx;
  const W = mapW, H = mapH;
  ctx.clearRect(0, 0, W, H);

  const padL = 24, padR = 6, padT = 10, padB = 20;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const cols = 8, rows = 6;
  const cw = plotW / cols, ch = plotH / rows;

  const lowC  = [34, 26, 66];
  const highC = [239, 68, 68];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const speedN = (c + 0.5) / cols;
      const loadN  = 1 - (r + 0.5) / rows;
      const v = mapValue(speedN, loadN);
      const [cr, cg, cb] = lerpRGB(lowC, highC, v);
      ctx.fillStyle = `rgb(${cr | 0}, ${cg | 0}, ${cb | 0})`;
      ctx.fillRect(padL + c * cw, padT + r * ch, cw - 0.5, ch - 0.5);
    }
  }

  const speedN = Math.max(0, Math.min(1, (rpm - CFG.minRpm) / (CFG.maxRpm - CFG.minRpm)));
  const loadN  = Math.max(0, Math.min(1, loadPct / 100));
  const mx = padL + speedN * plotW;
  const my = padT + (1 - loadN) * plotH;

  ctx.strokeStyle = dead ? 'rgba(239, 68, 68, 0.85)' : 'rgba(255, 255, 255, 0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(mx, padT);
  ctx.lineTo(mx, padT + plotH);
  ctx.moveTo(padL, my);
  ctx.lineTo(padL + plotW, my);
  ctx.stroke();

  ctx.fillStyle = dead ? '#ef4444' : '#ffffff';
  ctx.beginPath();
  ctx.arc(mx, my, 3.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(226, 232, 240, 0.70)';
  ctx.font = '8px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('100', padL - 4, padT + 4);
  ctx.fillText('50',  padL - 4, padT + plotH / 2);
  ctx.fillText('0',   padL - 4, padT + plotH - 4);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(String(CFG.minRpm), padL, padT + plotH + 4);
  ctx.fillText(String(CFG.maxRpm), padL + plotW, padT + plotH + 4);

  ctx.fillStyle = 'rgba(148, 163, 184, 0.65)';
  ctx.textAlign = 'left';
  ctx.fillText('load', 2, padT - 2);
  ctx.textAlign = 'right';
  ctx.fillText('rpm', W - padR, padT - 2);
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      state.load  = 35;
      state.fault = 'none';
      const inp = document.getElementById('load-range');
      const out = document.getElementById('load-out');
      if (inp) inp.value = 35;
      if (out) out.textContent = '35%';
      const b = document.getElementById('btn-fault');
      if (b) b.classList.remove('active');
      applyFaultVisuals();
      updateReadouts();
    }
  }
});
bridge.ready();
bridge.setStatus('ECU online', '#a855f7');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  t += dt * sp;

  const load = state.load / 100;
  const dead = state.fault === 'o2';

  /* --- Signal particles on wires --- */
  for (const L of lines) {
    const n = L.parts.length;
    const wireActive = !L.dead;
    for (let i = 0; i < n; i++) {
      const p = L.parts[i];
      if (!wireActive) { p.visible = false; continue; }
      p.visible = true;
      let u = (t * CFG.flowHz + i / n) % 1;
      if (u < 0) u += 1;
      p.position.lerpVectors(L.a, L.b, u);
      const pulse = 0.55 + 0.55 * Math.sin(Math.PI * u);
      const gain  = 0.7 + 0.6 * load;
      p.scale.setScalar(pulse * gain);
    }
  }

  /* --- CPU activity --- */
  const busy = 0.4 + 0.6 * load;
  const blink = 0.55 + 0.45 * Math.abs(Math.sin(t * 12));
  cpuGlowMat.emissiveIntensity = busy * blink * 1.3;
  cpuGlowMat.emissive.setHex(dead ? 0xef4444 : 0xa855f7);

  /* --- MIL lamp blink --- */
  if (dead) {
    milLampMat.emissiveIntensity = 1.0 + 0.5 * Math.abs(Math.sin(t * 5));
  }

  /* --- Injector spray — fix #2: anchor the cone base to the nozzle tip --- */
  if (load > 0.05 && !dead) {
    const sprayStrength = Math.min(1, load * 1.2);
    const pulse = 0.75 + 0.25 * Math.sin(t * 40);
    sprayMat.opacity = sprayStrength * pulse * 0.7;
    sprayCone.scale.y = 0.7 + load * 0.7;
    sprayCone.position.y = INJ_NOZZLE_Y - sprayCone.scale.y * SPRAY_HALF_HEIGHT;
  } else {
    sprayMat.opacity = 0;
  }

  /* --- Ignition coil spark --- */
  {
    const cycle = (t * 3.5) % 1;
    const flash = cycle < 0.10 ? Math.sin(cycle / 0.10 * Math.PI) : 0;
    if (!dead) {
      sparkMat.opacity = flash * (0.6 + load * 0.4);
      spark.scale.setScalar(0.6 + flash * 0.8);
    } else {
      sparkMat.opacity = 0;
    }
  }

  /* --- EGR puff --- */
  if (load > 0.25 && !dead) {
    const cycle = (t * 0.9) % 1;
    const puff  = cycle < 0.55 ? Math.sin(cycle / 0.55 * Math.PI) : 0;
    egrPuffMat.opacity = puff * 0.4 * load;
    egrPuff.scale.setScalar(0.7 + puff * 0.9);
  } else {
    egrPuffMat.opacity = 0;
  }

  /* --- Labels --- */
  labels.hideAll();
  if (state.showLabels) {
    labels.project('ecu', tmp.set(0, 1.18, 0), camera, wrap);
    labels.project('cpu', tmp.set(-0.72, 1.06, -0.05), camera, wrap);
    for (const n of INPUTS) {
      labels.project('in-' + n.id,
        tmp.set(n.mesh.position.x, n.mesh.position.y + 0.42, n.mesh.position.z), camera, wrap);
    }
    for (const n of OUTPUTS) {
      labels.project('out-' + n.id,
        tmp.set(n.mesh.position.x, n.mesh.position.y + 0.42, n.mesh.position.z), camera, wrap);
    }
  }

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.12) { roClock = 0; updateReadouts(); }
}

if (reduced) {
  setInterval(() => renderer.render(scene, camera), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts();
</script>
</body>
</html>
